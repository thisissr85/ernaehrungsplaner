    <!-- BAUSTEIN 41: LIVE-NÄHRWERTVORSCHAU IN BEIDEN KÜHLSCHRÄNKEN            -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            function findeSpalte(woerter) {
                return (AppDaten.naehrstoffSpalten || []).find(s =>
                    woerter.some(w => s.toLowerCase().includes(w))
                );
            }

            // Rechnet die Nährwerte live aus, sobald in ein Kühlschrank-Grammfeld getippt wird
            function ksVorschauAktualisieren(inputEl) {
                const id = inputEl.id || '';
                const istRezeptKs = id.startsWith('ks-gramm-');
                const istBeilagenKs = id.startsWith('bks-gramm-');
                if (!istRezeptKs && !istBeilagenKs) return;

                const karte = inputEl.closest('div[style*="border: 1px solid"]');
                if (!karte) return;

                // Vorschau-Zeile einmalig pro Karte anlegen, falls noch nicht vorhanden
                let vorschau = karte.querySelector('.ks-schoepf-vorschau');
                if (!vorschau) {
                    vorschau = document.createElement('div');
                    vorschau.className = 'ks-schoepf-vorschau';
                    vorschau.style.cssText = 'display: none; margin-top: 6px; padding: 5px 8px; background: #eef5f2; border: 1px solid #bfd8ce; border-radius: 6px; font-size: 12px; color: #1e293b;';
                    karte.appendChild(vorschau);
                }

                const gramm = parseFloat(inputEl.value);
                if (!gramm || gramm <= 0) {
                    vorschau.style.display = 'none';
                    return;
                }

                // Passenden Kühlschrank-Eintrag anhand der ID suchen
                let eintrag = null;
                if (istRezeptKs) {
                    const ksId = parseFloat(id.replace('ks-gramm-', ''));
                    eintrag = (AppDaten.kuehlschrankToepfe || []).find(k => k.ksId === ksId);
                } else {
                    const bksId = parseFloat(id.replace('bks-gramm-', ''));
                    eintrag = (AppDaten.kuehlschrankBeilagen || []).find(b => b.bksId === bksId);
                }

                if (!eintrag || !eintrag.wertePro100g) {
                    vorschau.style.display = 'none';
                    return;
                }

                const spKcal = findeSpalte(['kcal', 'kalorien', 'energie']);
                const spKh   = findeSpalte(['kohlenhydrat', 'kh']);
                const spProt = findeSpalte(['protein', 'eiweiß', 'eiweiss']);
                const spFett = findeSpalte(['fett']);

                const w = eintrag.wertePro100g;
                const f = gramm / 100;
                const teile = [
                    spKcal ? `<strong>${((w[spKcal] || 0) * f).toFixed(0)} kcal</strong>` : '',
                    spKh   ? `KH: <strong>${((w[spKh]   || 0) * f).toFixed(1)}g</strong>` : '',
                    spProt ? `P: <strong>${((w[spProt] || 0) * f).toFixed(1)}g</strong>` : '',
                    spFett ? `F: <strong>${((w[spFett] || 0) * f).toFixed(1)}g</strong>` : ''
                ].filter(Boolean);

                vorschau.style.display = 'block';
                vorschau.innerHTML = `<span style="color: #2e6f56; font-weight: bold;">📊 Portion (${gramm}g):</span> ${teile.join(' | ')}`;
            }

            // Reagiert zentral auf alle Eingaben in beiden Kühlschränken (auch bei neu hinzugefügten Töpfen)
            document.addEventListener('input', function(e) {
                if (e.target && e.target.id && (e.target.id.startsWith('ks-gramm-') || e.target.id.startsWith('bks-gramm-'))) {
                    ksVorschauAktualisieren(e.target);
                }
            });
        })();
    </script>

    <!-- BAUSTEIN 43: BEIDE KÜHLSCHRÄNKE EIN- UND AUSKLAPPBAR MACHEN           -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            // Hilfsfunktion: Macht eine bestehende Box über ihre Kopfzeile ein- und ausklappbar
            function macheKuehlschrankKlappbar(boxId, listeId) {
                const box = document.getElementById(boxId);
                const liste = document.getElementById(listeId);
                if (!box || !liste) return;

                const kopfZeile = liste.previousElementSibling;
                if (!kopfZeile) return;

                // Klickbar machen & Pfeil-Symbol ergänzen
                kopfZeile.style.cursor = 'pointer';
                const hinweisSpan = kopfZeile.querySelector('span:last-child');
                if (hinweisSpan) {
                    hinweisSpan.style.fontWeight = 'bold';
                    hinweisSpan.style.color = '#2e6f56';
                    hinweisSpan.innerText = '▲ Einklappen';
                }

                kopfZeile.onclick = function() {
                    const istZu = (liste.style.display === 'none');
                    liste.style.display = istZu ? 'block' : 'none';
                    kopfZeile.style.marginBottom = istZu ? '8px' : '0';
                    if (hinweisSpan) {
                        hinweisSpan.innerText = istZu ? '▲ Einklappen' : '▼ Ausklappen';
                    }
                };
            }

            // Auf beide Kühlschränke (Rezepte & Beilagenrechner) anwenden
            macheKuehlschrankKlappbar('ks-toepfe-box', 'ks-liste');
            macheKuehlschrankKlappbar('beilagen-ks-box', 'bks-liste');
        })();
    </script>

    <!-- ===================================================================== -->
    <script>
        (function() {
            const auftModul = document.getElementById('modul-aufteiler');
            const ksBox = document.getElementById('beilagen-ks-box');
            if (!auftModul || !ksBox || !auftModul.parentElement) return;

            // 1. Einen passenden äußeren Wrapper-Container (wie bei Rezepten) um den Kühlschrank bauen
            const aussenRahmen = document.createElement('div');
            aussenRahmen.id = 'beilagen-ks-aussen';
            aussenRahmen.style.cssText = 'background: #ffffff; border: 1px solid #d9d9d9; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.04);';

            // 2. Kühlschrank-Box aus dem unteren Kasten herausnehmen und sauber darüber setzen
            ksBox.style.marginBottom = '0';
            aussenRahmen.appendChild(ksBox);
            auftModul.parentElement.insertBefore(aussenRahmen, auftModul);

            // 3. Nur sichtbar machen, wenn der Tab "Beilagenrechner" aktiv ist
            function sichtbarkeitSync() {
                aussenRahmen.style.display = (auftModul.style.display === 'none') ? 'none' : 'block';
            }

            // Auf Tab-Wechsel achten (über MutationObserver am display-Stil von modul-aufteiler)
            const beobachter = new MutationObserver(sichtbarkeitSync);
            beobachter.observe(auftModul, { attributes: true, attributeFilter: ['style'] });
            sichtbarkeitSync();
        })();

            ksBox.style.cssText = 'background: #ffffff; border: 1px solid #d9d9d9; border-radius: 10px; padding: 12px 15px; margin-bottom: 12px;';
            auftModul.appendChild(ksBox);

    <script>
        (function() {
            const auftModul = document.getElementById('modul-aufteiler');
            const ksBox = document.getElementById('beilagen-ks-box');
            if (!auftModul || !ksBox) return;

            // Falls der Tab gerade offen ist, Flex-Spalte setzen; sonst block lassen
            const istSichtbar = auftModul.style.display !== 'none';
            if (istSichtbar) {
                auftModul.style.display = 'flex';
                auftModul.style.flexDirection = 'column';
                auftModul.style.gap = '16px';
            }

            // Tab-Wechsel überwachen, damit "display: flex" beim Öffnen erhalten bleibt
            const beobachter = new MutationObserver(() => {
                if (auftModul.style.display === 'block') {
                    auftModul.style.display = 'flex';
                    auftModul.style.flexDirection = 'column';
                    auftModul.style.gap = '16px';
                }
            });
            beobachter.observe(auftModul, { attributes: true, attributeFilter: ['style'] });

            // Zusätzlichen Sicherheitsabstand direkt an beiden Karten erzwingen
            ksBox.style.setProperty('margin-bottom', '14px', 'important');
            const zweiteKarte = ksBox.nextElementSibling;
            if (zweiteKarte) {

    <!-- ===================================================================== -->
    <!-- BAUSTEIN 59: DEZENTE ZIEL-GRAMM ANZEIGE BEI KH, PROTEIN & FETT        -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            const hauptwerte = document.getElementById('tp-hauptwerte');
            if (!hauptwerte || !window.tpZeichnen) return;

            window.tpMakroZieleAnzeigen = function() {
                // Aktuelle Ziele aus AppDaten.ziele (oder direkt aus den Eingabefeldern) auslesen
                const z = AppDaten.ziele || {};
                const kcalZiel = parseFloat(document.getElementById('ziel-kcal')?.value) || z.kcal || 1600;
                const khProz   = parseFloat(document.getElementById('ziel-kh')?.value)   || z.kh   || 35;
                const protProz = parseFloat(document.getElementById('ziel-prot')?.value) || z.prot || 35;
                const fettProz = parseFloat(document.getElementById('ziel-fett')?.value) || z.fett || 30;

                // Ziel-Gramm berechnen (KH & Protein = 4 kcal/g, Fett = 9 kcal/g)
                const sollKh   = Math.round((kcalZiel * (khProz / 100)) / 4);
                const sollProt = Math.round((kcalZiel * (protProz / 100)) / 4);
                const sollFett = Math.round((kcalZiel * (fettProz / 100)) / 9);

                // Die 5 Hauptwert-Kacheln durchgehen und nur bei KH, Protein und Fett dezent "von Xg" anhängen
                hauptwerte.querySelectorAll(':scope > div').forEach(kachel => {
                    // Vorherige Ziel-Anzeige entfernen, damit nichts doppelt steht
                    const altesZiel = kachel.querySelector('.tp-makro-soll');
                    if (altesZiel) altesZiel.remove();

                    const text = kachel.innerText.toLowerCase();
                    let sollWert = null;

                    if (text.includes('kh:') || text.includes('kohlenhydrat')) sollWert = sollKh;
                    else if (text.includes('protein') || text.includes('eiweiß')) sollWert = sollProt;
                    else if (text.includes('fett')) sollWert = sollFett;

                    if (sollWert !== null) {
                        const span = document.createElement('span');
                        span.className = 'tp-makro-soll';
                        span.style.cssText = 'font-size: 12px !important; font-weight: normal !important; color: #64748b !important; margin-left: 3px;';
                        span.innerText = `von ${sollWert}g`;
                        kachel.appendChild(span);
                    }
                });
            };

            // Sauber an tpZeichnen anhängen und direkt einmal ausführen
            const vorherigesZeichnen = window.tpZeichnen;
            window.tpZeichnen = function() {
                vorherigesZeichnen();
                tpMakroZieleAnzeigen();
            };

            tpMakroZieleAnzeigen();
        })();
    </script>

    <!-- BAUSTEIN 60: AUFGENOMMENE IST-WERTE IN DER TAGESBILANZ STÄRKER BETONEN -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            const hauptwerte = document.getElementById('tp-hauptwerte');

    <!-- ===================================================================== -->
    <!-- BAUSTEIN 61: EINTRÄGE ZWISCHEN MAHLZEITEN VERSCHIEBEN (⇄)            -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            const datumFeld = document.getElementById('tp-datum');
            if (!datumFeld || !window.tpZeichnen) return;

            // Verschiebt einen Eintrag per Auswahldialog in eine andere Mahlzeit
            window.tpEintragVerschieben = function(eintragId) {
                const datum = datumFeld.value;
                const eintraege = (AppDaten.tagesplan && AppDaten.tagesplan[datum]) ? AppDaten.tagesplan[datum] : [];
                const eintrag = eintraege.find(e => e.eintragId === eintragId);
                if (!eintrag) return;

                const ziele = ['Frühstück', 'Mittagessen', 'Abendessen', 'Snack'].filter(m => m !== eintrag.mahlzeit);
                const auswahlText = ziele.map((m, idx) => `${idx + 1} = ${m}`).join('\n');

                const eingabe = prompt(
                    `"${eintrag.name}" (${eintrag.gramm}g) von ${eintrag.mahlzeit} verschieben nach:\n\n${auswahlText}\n\nBitte Zahl (1–3) eingeben:`,
                    '1'
                );
                if (eingabe === null) return;

                const index = parseInt(eingabe.trim(), 10) - 1;
                if (isNaN(index) || !ziele[index]) {
                    return alert('Ungültige Auswahl – bitte 1, 2 oder 3 eingeben.');
                }

                eintrag.mahlzeit = ziele[index];
                speichereDaten();
                tpZeichnen();
            };

            // Hängt den dezenten Verschieben-Button (⇄) direkt vor den Bearbeiten-Stift (✏️)
            window.tpMoveButtonsAnhaengen = function() {
                const editButtons = document.querySelectorAll('#tp-mahlzeiten-liste .tp-edit-btn');
                editButtons.forEach(editBtn => {
                    const gruppe = editBtn.parentElement;
                    if (!gruppe || gruppe.querySelector('.tp-move-btn')) return;

                    const onclickText = editBtn.getAttribute('onclick') || '';
                    const start = onclickText.indexOf('(');
                    const ende = onclickText.indexOf(')');
                    if (start === -1 || ende <= start) return;
                    const eintragId = onclickText.slice(start + 1, ende);

                    const moveBtn = document.createElement('button');
                    moveBtn.type = 'button';
                    moveBtn.className = 'tp-move-btn';
                    moveBtn.innerText = '⇄';
                    moveBtn.title = 'In andere Mahlzeit verschieben';
                    moveBtn.style.cssText = 'background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; border-radius: 5px; padding: 2px 7px; font-size: 12px; font-weight: 600; cursor: pointer;';
                    moveBtn.setAttribute('onclick', `tpEintragVerschieben(${eintragId})`);

                    gruppe.insertBefore(moveBtn, editBtn);
                });
            };

            // Sauber an tpZeichnen anhängen und direkt einmal ausführen
            const vorherigesZeichnen = window.tpZeichnen;
            window.tpZeichnen = function() {
                vorherigesZeichnen();
                tpMoveButtonsAnhaengen();
            };

            tpMoveButtonsAnhaengen();
        })();
    </script>


    <!-- ===================================================================== -->
    <!-- BAUSTEIN 62: RÜCKWÄRTS-RECHNER IM REZEPTE-KÜHLSCHRANK                -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            if (!document.getElementById('ks-liste') || !window.ksListeZeichnen) return;

            function findeSpalte(woerter) {
                return (AppDaten.naehrstoffSpalten || []).find(s =>
                    woerter.some(w => s.toLowerCase().includes(w))
                );
            }

            // Rechnet live aus, wie viele Gramm für den Wunsch-Wert geschöpft werden müssen
            window.ksRwBerechnen = function(ksId) {
                const eintrag = (AppDaten.kuehlschrankToepfe || []).find(k => k.ksId === ksId);
                const ausgabe = document.getElementById('ks-rw-erg-' + ksId);
                if (!eintrag || !ausgabe) return;

                const zielTyp = document.getElementById('ks-rw-typ-' + ksId)?.value || 'kcal';
                const zielWert = parseFloat(document.getElementById('ks-rw-wert-' + ksId)?.value);

                if (!zielWert || zielWert <= 0) {
                    ausgabe.innerHTML = 'Bitte gewünschten Zielwert eingeben.';
                    return;
                }

                const spMap = {
                    kcal: findeSpalte(['kcal', 'kalorien', 'energie']),
                    kh:   findeSpalte(['kohlenhydrat', 'kh']),
                    prot: findeSpalte(['protein', 'eiweiß', 'eiweiss']),
                    fett: findeSpalte(['fett'])
                };

                const spalte = spMap[zielTyp];
                const wertPro100g = spalte ? (eintrag.wertePro100g[spalte] || 0) : 0;

                if (wertPro100g <= 0) {
                    ausgabe.innerHTML = '<span style="color: #dc3545;">⚠️ Dieser Nährwert ist in diesem Gericht 0.</span>';
                    return;
                }

                const benoetigteGramm = Math.round((zielWert / wertPro100g) * 100);
                const f = benoetigteGramm / 100;
                const w = eintrag.wertePro100g;

                const infoTeile = [
                    spMap.kcal ? `${((w[spMap.kcal] || 0) * f).toFixed(0)} kcal` : '',
                    spMap.kh   ? `KH: ${((w[spMap.kh]   || 0) * f).toFixed(1)}g` : '',
                    spMap.prot ? `P: ${((w[spMap.prot] || 0) * f).toFixed(1)}g` : '',
                    spMap.fett ? `F: ${((w[spMap.fett] || 0) * f).toFixed(1)}g` : ''
                ].filter(Boolean).join(' | ');

                ausgabe.innerHTML = `
                    <span style="color: #2e6f56; font-weight: bold;">➔ Empfohlene Portion: ${benoetigteGramm} g</span>
                    <span style="font-size: 11px; color: #475569;"> (${infoTeile})</span>
                    <button type="button" onclick="ksRwUebernehmen(${ksId}, ${benoetigteGramm})" 
                            style="margin-left: 8px; padding: 3px 8px; background: #2e6f56; color: white; border: none; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">
                        ⬆️ Ins Schöpf-Feld übernehmen
                    </button>
                `;
            };

            // Überträgt die berechnete Grammzahl direkt ins Schöpf-Feld & löst die Live-Vorschau aus
            window.ksRwUebernehmen = function(ksId, gramm) {
                const feld = document.getElementById('ks-gramm-' + ksId);
                if (feld) {
                    feld.value = gramm;
                    feld.dispatchEvent(new Event('input', { bubbles: true }));
                }
            };

            // Ergänzt in jeder Kühlschrank-Karte den ausklappbaren Rückwärts-Rechner
            window.ksRwAnhaengen = function() {
                document.querySelectorAll('#ks-liste > div').forEach(karte => {
                    if (karte.querySelector('.ks-rw-box')) return;

                    const grammInput = karte.querySelector('input[id^="ks-gramm-"]');
                    if (!grammInput) return;
                    const ksId = grammInput.id.replace('ks-gramm-', '');

                    const rwBox = document.createElement('div');
                    rwBox.className = 'ks-rw-box';
                    rwBox.style.cssText = 'margin-top: 8px; padding-top: 6px; border-top: 1px dashed #cbd5e1; font-size: 12px;';
                    rwBox.innerHTML = `
                        <button type="button" onclick="const el = document.getElementById('ks-rw-body-${ksId}'); el.style.display = (el.style.display === 'none' ? 'block' : 'none');"
                                style="background: none; border: none; color: #2e6f56; font-weight: bold; font-size: 12px; cursor: pointer; padding: 0;">
                            🎯 Rückwärts-Rechner: Gramm für Wunsch-Makros berechnen ▼
                        </button>
                        <div id="ks-rw-body-${ksId}" style="display: none; margin-top: 6px; background: #ffffff; padding: 8px; border-radius: 6px; border: 1px solid #d9d9d9;">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px;">
                                <select id="ks-rw-typ-${ksId}" onchange="ksRwBerechnen(${ksId})" style="margin: 0; padding: 5px; font-size: 12px;">
                                    <option value="kcal">🎯 Ziel-Kalorien (kcal)</option>
                                    <option value="prot">💪 Ziel-Protein (g)</option>
                                    <option value="kh">🍞 Ziel-Kohlenhydrate (g)</option>
                                    <option value="fett">🥑 Ziel-Fett (g)</option>
                                </select>
                                <input type="number" id="ks-rw-wert-${ksId}" placeholder="Wunschwert (z.B. 450)" onkeyup="ksRwBerechnen(${ksId})" onchange="ksRwBerechnen(${ksId})" style="margin: 0; padding: 5px; font-size: 12px;">
                            </div>
                            <div id="ks-rw-erg-${ksId}" style="color: #475569;">Bitte Zielwert eingeben.</div>
                        </div>
                    `;
                    karte.appendChild(rwBox);
                });
            };

            // Sauber an ksListeZeichnen anhängen und direkt einmal ausführen
            const vorherigesKsZeichnen = window.ksListeZeichnen;
            window.ksListeZeichnen = function() {
                vorherigesKsZeichnen();
                ksRwAnhaengen();
            };

            ksRwAnhaengen();
        })();
    </script>


    <!-- ===================================================================== -->
    <!-- BAUSTEIN 63: DIREKTES BACKUP IN FESTEN ZIELORDNER / FESTE DATEI       -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            let gespeicherterDateiGriff = null;

            // Überschreibt die bestehende Backup-Funktion mit Direkt-Speicherung in deinen Wunschordner
            window.exportiereBackup = async function() {
                const jsonText = JSON.stringify(AppDaten, null, 2);
                const heute = new Date().toISOString().slice(0, 10);

                // Moderne Browser (Chrome/Edge am PC): Merkt sich deinen Wunschordner & überschreibt direkt die Backup-Datei
                if ('showSaveFilePicker' in window) {
                    try {
                        // Wenn in dieser Sitzung noch keine Zieldatei gewählt wurde, einmalig den Ordner wählen (Browser merkt sich den Pfad!)
                        if (!gespeicherterDateiGriff) {
                            gespeicherterDateiGriff = await window.showSaveFilePicker({
                                id: 'ernaehrungsplan-backup-ordner',
                                suggestedName: `ernaehrungsplan-backup-${heute}.json`,
                                types: [{
                                    description: 'JSON Backup-Datei',
                                    accept: { 'application/json': ['.json'] }
                                }]
                            });
                        }

                        // Direkt ohne weiteren Dialog in genau diese Datei schreiben
                        const schreiber = await gespeicherterDateiGriff.createWritable();
                        await schreiber.write(jsonText);
                        await schreiber.close();

                        alert(`✅ Backup erfolgreich direkt in "${gespeicherterDateiGriff.name}" gespeichert!`);
                        return;
                    } catch (err) {
                        // Falls Nutzer im Dialog auf "Abbrechen" klickt, sauber beenden
                        if (err.name === 'AbortError') return;
                        gespeicherterDateiGriff = null;
                    }
                }

                // Fallback für Handy / Firefox: Klassischer Download
                const blob = new Blob([jsonText], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ernaehrungsplan-backup-${heute}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };
        })();
    </script>


</body>
</html>
