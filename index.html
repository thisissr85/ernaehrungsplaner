<html lang="de">

    <!-- Grundeinstellungen für Umlaute (ä, ö, ü, ß) und Handy-Display -->

    <!-- DESIGN-BLOCK (CSS) -->
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 15px; background: #f4f6f8; color: #333; }

<!-- KERN-SYSTEM MIT SUPABASE-SYNC -->
<script src="https://jsdelivr.net"></script>
<script>
const SUPABASE_URL = 'https://czawxhzlvtywzragbrjl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FUjrl_0V4OKGjqhlywNmvA_inSrxqu4';
const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;


const AppDaten = JSON.parse(localStorage.getItem('meinPlanerDaten')) || {
  naehrstoffSpalten: [],
  lebensmittel: [],
  toepfe: [],
  rezepte: [],
  tagesplan: {},
  gewicht: []
};

let syncTimer = null;
function speichereDaten() {
  localStorage.setItem('meinPlanerDaten', JSON.stringify(AppDaten));
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await sbClient.from('planer_speicher').upsert({ id: 'hauptprofil', daten: AppDaten });
    } catch (err) {
      console.error('Supabase Speicherfehler:', err);
    }
  }, 500);
}

async function ladeVonSupabase() {
  try {
    const { data, error } = await sbClient
      .from('planer_speicher')
      .select('daten')
      .eq('id', 'hauptprofil')
      .maybeSingle();

    if (data && data.daten) {
      const lokalText = localStorage.getItem('meinPlanerDaten');
      const cloudText = JSON.stringify(data.daten);
      if (lokalText !== cloudText) {
        localStorage.setItem('meinPlanerDaten', cloudText);
        location.reload();
      }
    }
  } catch (err) {
    console.error('Supabase Ladefehler:', err);
  }
}
window.addEventListener('DOMContentLoaded', ladeVonSupabase);




        function registriereModul(id, titel, htmlInhalt, initFunktion) {
            const navi = document.getElementById('haupt-navi');
            const inhalt = document.getElementById('app-inhalt');

            const btn = document.createElement('button');
            btn.innerText = titel;
            btn.onclick = () => {
                document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.modul').forEach(m => m.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('modul-' + id).classList.add('active');
            };
            navi.appendChild(btn);

            const section = document.createElement('section');
            section.id = 'modul-' + id;
            section.className = 'modul';
            section.innerHTML = htmlInhalt;
            inhalt.appendChild(section);

            if (navi.children.length === 1) btn.click();
            if (initFunktion) initFunktion();
        }
    </script>
    <!-- BAUSTEIN 1: CSV-IMPORT (41 SPALTEN) -->
    <script>
        registriereModul('lebensmittel', '🍎 Lebensmittel & CSV', `
            <h2>1. Excel-CSV einlesen (41 Spalten)</h2>
            <p style="font-size: 14px; color: #555;">
                Speichere dein Lebensmittel-Blatt als <strong>CSV (Trennzeichen-getrennt) (*.csv)</strong>. Spalte 1 = Name, alle weiteren Spalten = Nährwerte.
            </p>
            <input type="file" id="csv-datei" accept=".csv">
            <button class="action" onclick="csvImportieren()">📥 CSV-Datei jetzt einlesen</button>
            <div id="csv-status" style="font-size: 14px; font-weight: bold; color: #007bff; margin-bottom: 15px;"></div>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            <h2>2. Deine Lebensmittel (<span id="lm-anzahl">0</span>)</h2>
            <input type="text" id="lm-suche" placeholder="🔍 Lebensmittel suchen..." onkeyup="lmListeZeichnen()">
            <div id="lm-liste"></div>
        `, () => {
            function bereinigeZahl(text) {
                if (!text) return 0;
                let sauber = text.replace(/["'\s]/g, '');
                if (sauber.includes(',')) sauber = sauber.replace(/\./g, '').replace(',', '.');
                const zahl = parseFloat(sauber);
                return isNaN(zahl) ? 0 : zahl;
            }

            window.csvImportieren = function() {
                const dateiInput = document.getElementById('csv-datei');
                if (!dateiInput.files.length) return alert('Bitte zuerst CSV-Datei auswählen!');
                const reader = new FileReader();
                reader.onload = function(event) {
                    const zeilen = event.target.result.split(/\r?\n/).filter(z => z.trim() !== '');
                    if (zeilen.length < 2) return alert('Die CSV-Datei ist leer!');
                    const ersteZeile = zeilen.at(0);
                    const trenner = ersteZeile.includes(';') ? ';' : ',';
                    const kopfZeile = ersteZeile.split(trenner).map(s => s.replace(/^"|"$/g, '').trim());
                    const naehrstoffNamen = kopfZeile.slice(1);
                    AppDaten.naehrstoffSpalten = naehrstoffNamen;

                    const neueLebensmittel = [];
                    for (let i = 1; i < zeilen.length; i++) {
                        const werte = zeilen[i].split(trenner).map(w => w.replace(/^"|"$/g, '').trim());
                        const name = werte.at(0);
                        if (!name) continue;
                        const naehrwerteObjekt = {};
                        for (let s = 0; s < naehrstoffNamen.length; s++) {
                            const spaltenName = naehrstoffNamen[s] || ('Spalte_' + (s + 2));
                            naehrwerteObjekt[spaltenName] = bereinigeZahl(werte[s + 1]);
                        }
                        neueLebensmittel.push({ id: Date.now() + i, name: name, werte: naehrwerteObjekt });
                    }
                    AppDaten.lebensmittel = neueLebensmittel;
                    speichereDaten();
                    document.getElementById('csv-status').innerText = 
                        `✅ Geladen: ${neueLebensmittel.length} Lebensmittel mit je ${naehrstoffNamen.length} Nährwert-Spalten!`;
                    lmListeZeichnen();
                };
                reader.readAsText(dateiInput.files.item(0), 'ISO-8859-1');
            };

            window.lmListeZeichnen = function() {
                const suchbegriff = document.getElementById('lm-suche').value.toLowerCase();
                const liste = document.getElementById('lm-liste');
                const gefiltert = AppDaten.lebensmittel.filter(lm => lm.name.toLowerCase().includes(suchbegriff));
                document.getElementById('lm-anzahl').innerText = gefiltert.length;
                liste.innerHTML = gefiltert.slice(0, 50).map((lm, index) => {
                    const alleWerteHTML = Object.entries(lm.werte).map(([key, val]) => `<div><strong>${key}:</strong> ${val}</div>`).join('');
                    return `
                        <div class="lm-karte">
                            <div class="lm-kopf" onclick="document.getElementById('det-${index}').classList.toggle('versteckt')">
                                <span>${lm.name}</span>
                                <span class="badge">▼ Alle ${Object.keys(lm.werte).length} Werte</span>
                            </div>
                            <div id="det-${index}" class="lm-details versteckt">${alleWerteHTML}</div>
                        </div>`;
                }).join('');
            };
            lmListeZeichnen();
        });
    </script>

    <!-- BAUSTEIN 2: BACKUP -->
    <script>
        registriereModul('backup', '💾 Backup', `
            <h2>Datensicherung</h2>
            <button class="action" onclick="exportiereBackup()">⬇️ Backup herunterladen</button>
            <input type="file" id="backup-datei" accept=".json">
            <button class="action" style="background: #007bff;" onclick="importiereBackup()">⬆️ Backup laden</button>
        `, () => {
            window.exportiereBackup = function() {
                const blob = new Blob([JSON.stringify(AppDaten, null, 2)], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'ernaehrungsplan-backup-' + new Date().toISOString().slice(0,10) + '.json';
                link.click();
            };
            window.importiereBackup = function() {
                const dateiInput = document.getElementById('backup-datei');
                if (!dateiInput.files.length) return alert('Bitte Backup-Datei wählen!');
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        Object.assign(AppDaten, JSON.parse(e.target.result));
                        speichereDaten();
                        alert('Backup geladen!');
                        location.reload();
                    } catch (err) { alert('Ungültige Datei.'); }
                };
                reader.readAsText(dateiInput.files.item(0));
            };
        });
    </script>

    <!-- BAUSTEIN 3: TAGESPLAN -->
    <script>
        registriereModul('tagesplan', '📅 Tagesplan', `
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                <strong style="white-space: nowrap;">Datum:</strong>
                <input type="date" id="tp-datum" style="margin: 0;" onchange="tpZeichnen()">
            </div>

            <div style="background: #eef5ff; border: 1px solid #cce0ff; border-radius: 8px; padding: 12px; margin-bottom: 15px;">
                <h3 style="margin: 0 0 8px 0; font-size: 16px; color: #0056b3;">📊 Tagesbilanz (Gesamt)</h3>
                <div id="tp-hauptwerte" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; font-size: 14px;"></div>
                
                <button type="button" onclick="const b = document.getElementById('tp-mikros-box'); b.style.display = (b.style.display === 'none' ? 'grid' : 'none');" 
                        style="width: 100%; margin-top: 10px; padding: 6px; background: #d6e6ff; border: none; border-radius: 6px; font-weight: bold; color: #004085; cursor: pointer;">
                    ▼ Alle weiteren Nährstoffe (Mikros) ein-/ausblenden
                </button>
                <div id="tp-mikros-box" style="display: none; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #99c2ff; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 13px;"></div>
            </div>

            <div style="background: #f9f9f9; border: 1px solid #e0e4e8; border-radius: 8px; padding: 12px; margin-bottom: 15px;">
                <h3 style="margin: 0 0 8px 0; font-size: 16px;">➕ Eintrag hinzufügen</h3>
                <select id="tp-mahlzeit">
                    <option value="Frühstück">🍳 Frühstück</option>
                    <option value="Mittagessen">🍲 Mittagessen</option>
                    <option value="Abendessen">🥗 Abendessen</option>
                    <option value="Snack">🍎 Snack</option>
                </select>
                <input type="text" id="tp-lm-filter" placeholder="🔍 Lebensmittel filtern..." onkeyup="tpDropdownFuellen()" style="margin-bottom: 4px;">
                <select id="tp-lm-auswahl"></select>
                <input type="number" id="tp-gramm" placeholder="Menge in Gramm (z.B. 150)">
                <button class="action" onclick="tpEintragHinzufuegen()">Zum Tagesplan hinzufügen</button>
            </div>

            <div id="tp-mahlzeiten-liste"></div>
        `, () => {
            const datumFeld = document.getElementById('tp-datum');
            datumFeld.value = new Date().toISOString().slice(0, 10);

            function findeSpalte(suchwoerter) {
                return AppDaten.naehrstoffSpalten.find(spalte => 
                    suchwoerter.some(wort => spalte.toLowerCase().includes(wort))
                );
            }

            window.tpDropdownFuellen = function() {
                const filter = document.getElementById('tp-lm-filter').value.toLowerCase();
                const select = document.getElementById('tp-lm-auswahl');
                const treffer = AppDaten.lebensmittel.filter(lm => lm.name.toLowerCase().includes(filter));
                select.innerHTML = treffer.slice(0, 100).map(lm => 
                    `<option value="${lm.id}">${lm.name}</option>`
                ).join('');
            };

            window.tpEintragHinzufuegen = function() {
                const datum = datumFeld.value;
                const mahlzeit = document.getElementById('tp-mahlzeit').value;
                const lmId = parseFloat(document.getElementById('tp-lm-auswahl').value);
                const gramm = parseFloat(document.getElementById('tp-gramm').value);

                if (!lmId) return alert('Bitte ein Lebensmittel auswählen!');
                if (!gramm || gramm <= 0) return alert('Bitte eine gültige Grammzahl eingeben!');

                const lebensmittel = AppDaten.lebensmittel.find(lm => lm.id === lmId);
                if (!lebensmittel) return;

                if (!AppDaten.tagesplan[datum]) AppDaten.tagesplan[datum] = [];

                AppDaten.tagesplan[datum].push({
                    eintragId: Date.now(),
                    mahlzeit: mahlzeit,
                    name: lebensmittel.name,
                    gramm: gramm,
                    wertePro100g: lebensmittel.werte
                });

                speichereDaten();
                document.getElementById('tp-gramm').value = '';
                tpZeichnen();
            };

            window.tpEintragLoeschen = function(eintragId) {
                const datum = datumFeld.value;
                if (!AppDaten.tagesplan[datum]) return;
                AppDaten.tagesplan[datum] = AppDaten.tagesplan[datum].filter(e => e.eintragId !== eintragId);
                speichereDaten();
                tpZeichnen();
            };

            window.tpZeichnen = function() {
                const datum = datumFeld.value;
                const eintraege = AppDaten.tagesplan[datum] || [];

                const summen = {};
                AppDaten.naehrstoffSpalten.forEach(spalte => summen[spalte] = 0);

                eintraege.forEach(eintrag => {
                    const faktor = eintrag.gramm / 100;
                    for (const [spalte, wertPro100] of Object.entries(eintrag.wertePro100g)) {
                        summen[spalte] = (summen[spalte] || 0) + (wertPro100 * faktor);
                    }
                });

                const spKcal = findeSpalte(['kcal', 'kalorien', 'energie']);
                const spKh   = findeSpalte(['kohlenhydrat', 'kh']);
                const spProt = findeSpalte(['protein', 'eiweiß', 'eiweiss']);
                const spFett = findeSpalte(['fett']);
                const spBall = findeSpalte(['ballaststoff']);
                const hauptSpalten = [spKcal, spKh, spProt, spFett, spBall].filter(Boolean);

                document.getElementById('tp-hauptwerte').innerHTML = hauptSpalten.map(spalte => 
                    `<div><strong>${spalte}:</strong> ${(summen[spalte] || 0).toFixed(1)}</div>`
                ).join('');

                const restSpalten = AppDaten.naehrstoffSpalten.filter(s => !hauptSpalten.includes(s));
                document.getElementById('tp-mikros-box').innerHTML = restSpalten.map(spalte => 
                    `<div><strong>${spalte}:</strong> ${(summen[spalte] || 0).toFixed(2)}</div>`
                ).join('');

                const mahlzeiten = ['Frühstück', 'Mittagessen', 'Abendessen', 'Snack'];
                document.getElementById('tp-mahlzeiten-liste').innerHTML = mahlzeiten.map(mz => {
                    const mzEintraege = eintraege.filter(e => e.mahlzeit === mz);
                    const itemsHTML = mzEintraege.length === 0 
                        ? '<div style="font-size: 13px; color: #888; padding: 4px 0;">Noch nichts eingetragen</div>'
                        : mzEintraege.map(e => {
                            const kcalInfo = spKcal ? ` (${((e.wertePro100g[spKcal] || 0) * e.gramm / 100).toFixed(0)} kcal)` : '';
                            return `
                                <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f0;">
                                    <span><strong>${e.gramm}g</strong> ${e.name}${kcalInfo}</span>
                                    <button onclick="tpEintragLoeschen(${e.eintragId})" style="background: #dc3545; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer;">✕</button>
                                </div>`;
                        }).join('');

                    return `
                        <div style="margin-bottom: 12px; border: 1px solid #e0e4e8; border-radius: 8px; padding: 10px;">
                            <strong style="color: #007bff;">${mz}</strong>
                            ${itemsHTML}
                        </div>`;
                }).join('');
            };

            tpDropdownFuellen();
            tpZeichnen();
        });
    </script>

    <!-- ===================================================================== -->
    <!-- BAUSTEIN 4: TÖPFE & GEFÄSSE VERWALTEN (Leergewicht / Tara)           -->
    <!-- ===================================================================== -->
    <script>
        registriereModul('toepfe', '🍳 Töpfe', `
            <!-- EINGABEBEREICH FÜR NEUE TÖPFE / GEFÄSSE -->
            <div style="background: #f9f9f9; border: 1px solid #e0e4e8; border-radius: 8px; padding: 12px; margin-bottom: 15px;">
                <h2 style="margin: 0 0 8px 0; font-size: 18px;">➕ Neuen Topf / Gefäß anlegen</h2>
                <p style="font-size: 13px; color: #555; margin-top: 0;">
                    Trage hier das Leergewicht (Tara) deiner Töpfe, Pfannen oder Schüsseln ein, um es später beim Wiegen automatisch abzuziehen.
                </p>
                
                <input type="text" id="topf-name" placeholder="Bezeichnung (z.B. Großer Suppentopf, Glas-Schüssel)">
                <input type="number" id="topf-gewicht" placeholder="Leergewicht in Gramm (z.B. 1250)">
                <button class="action" onclick="topfHinzufuegen()">Topf speichern</button>
            </div>

            <!-- LISTE ALLER GESPEICHERTEN TÖPFE -->
            <h3 style="margin: 0 0 8px 0; font-size: 16px;">Gespeicherte Töpfe & Gefäße (<span id="topf-anzahl">0</span>)</h3>
            <div id="topf-liste"></div>
        `, () => {

            // FUNKTION: Neuen Topf zur Datenbank hinzufügen
            window.topfHinzufuegen = function() {
                const nameFeld = document.getElementById('topf-name');
                const gewichtFeld = document.getElementById('topf-gewicht');
                
                const name = nameFeld.value.trim();
                const gewicht = parseFloat(gewichtFeld.value);

                if (!name) return alert('Bitte gib dem Topf oder Gefäß einen Namen!');
                if (!gewicht || gewicht <= 0) return alert('Bitte ein gültiges Leergewicht in Gramm eingeben!');

                // In die zentrale Datenbank speichern
                AppDaten.toepfe.push({
                    id: Date.now(),
                    name: name,
                    gewicht: gewicht
                });

                // Alphabetisch nach Namen sortieren, damit du sie später im Dropdown schnell findest
                AppDaten.toepfe.sort((a, b) => a.name.localeCompare(b.name));

                speichereDaten(); // Dauerhaft sichern
                nameFeld.value = ''; // Eingabefelder leeren
                gewichtFeld.value = '';
                toepfeZeichnen(); // Liste aktualisieren
            };

            // FUNKTION: Einen Topf wieder aus der Liste löschen
            window.topfLoeschen = function(id) {
                if (!confirm('Dieses Gefäß wirklich löschen?')) return;
                AppDaten.toepfe = AppDaten.toepfe.filter(t => t.id !== id);
                speichereDaten();
                toepfeZeichnen();
            };

            // FUNKTION: Alle gespeicherten Töpfe auf der Seite anzeigen
            window.toepfeZeichnen = function() {
                const liste = document.getElementById('topf-liste');
                const anzahlSpan = document.getElementById('topf-anzahl');
                
                anzahlSpan.innerText = AppDaten.toepfe.length;

                if (AppDaten.toepfe.length === 0) {
                    liste.innerHTML = '<div style="font-size: 14px; color: #888; padding: 10px 0;">Noch keine Töpfe oder Gefäße gespeichert.</div>';
                    return;
                }

                liste.innerHTML = AppDaten.toepfe.map(t => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #e0e4e8; border-radius: 6px; margin-bottom: 8px; background: #fafbfc;">
                        <div>
                            <strong>${t.name}</strong><br>
                            <span style="font-size: 13px; color: #555;">Leergewicht (Tara): <strong>${t.gewicht} g</strong></span>
                        </div>
                        <button onclick="topfLoeschen(${t.id})" style="background: #dc3545; color: white; border: none; border-radius: 4px; padding: 6px 10px; cursor: pointer;">✕</button>
                    </div>
                `).join('');
            };

            // Beim Start der App die bereits gespeicherten Töpfe direkt anzeigen
            toepfeZeichnen();
        });
    </script>

    <!-- ===================================================================== -->
    <!-- BAUSTEIN 5: WOCHENLEISTE (Mo–So & Wochen-Navigation für den Tagesplan)-->
    <!-- ===================================================================== -->
    <script>
        (function() {
            // Sucht das bestehende Datumsfeld im Tagesplan
            const datumFeld = document.getElementById('tp-datum');
            if (!datumFeld) return;

            // Erstellt die neue Wochen-Navigation direkt oberhalb des Datumsfelds
            const wochenBox = document.createElement('div');
            wochenBox.style.cssText = 'background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 12px;';
            wochenBox.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px;">
                    <button type="button" onclick="tpWocheWechseln(-7)" style="padding: 6px 10px; border: 1px solid #ccc; background: white; border-radius: 6px; cursor: pointer; font-weight: bold;">◀ -1 Wo</button>
                    <button type="button" onclick="tpHeuteWaehlen()" style="padding: 6px 12px; border: 1px solid #007bff; background: #eef5ff; color: #0056b3; border-radius: 6px; cursor: pointer; font-weight: bold;">Heute</button>
                    <button type="button" onclick="tpWocheWechseln(7)" style="padding: 6px 10px; border: 1px solid #ccc; background: white; border-radius: 6px; cursor: pointer; font-weight: bold;">+1 Wo ▶</button>
                </div>
                <div id="tp-wochentage" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;"></div>
            `;

            // Fügt die Wochenleiste ganz oben in den Tagesplan ein
            const tagesplanModul = document.getElementById('modul-tagesplan');
            tagesplanModul.insertBefore(wochenBox, tagesplanModul.firstChild);

            // Hilfsfunktion: Berechnet aus einem Datum das YYYY-MM-DD Format ohne Zeitzonen-Fehler
            function formatDatum(d) {
                const jahr = d.getFullYear();
                const monat = String(d.getMonth() + 1).padStart(2, '0');
                const tag = String(d.getDate()).padStart(2, '0');
                return `${jahr}-${monat}-${tag}`;
            }

            // Zeichnet die 7 Buttons (Mo bis So) passend zum aktuell gewählten Datum
            window.tpWochenLeisteZeichnen = function() {
                const gewaehltStr = datumFeld.value;
                const teile = gewaehltStr.split('-');
                const gewaehlt = new Date(teile.at(0), teile.at(1) - 1, teile.at(2));

                // Montag dieser Woche ermitteln (Sonntag = 0 wird zu 7)
                const wochentag = gewaehlt.getDay() || 7;
                const montag = new Date(gewaehlt);
                montag.setDate(gewaehlt.getDate() - wochentag + 1);

                const tageNamen = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
                const container = document.getElementById('tp-wochentage');
                let html = '';

                for (let i = 0; i < 7; i++) {
                    const tagDatum = new Date(montag);
                    tagDatum.setDate(montag.getDate() + i);
                    const tagStr = formatDatum(tagDatum);
                    const istAktiv = (tagStr === gewaehltStr);
                    const hatEintraege = (AppDaten.tagesplan[tagStr] && AppDaten.tagesplan[tagStr].length > 0);

                    // Aktiver Tag wird blau, Tage mit gespeicherten Mahlzeiten bekommen einen grünen Punkt
                    const bg = istAktiv ? '#007bff' : (hatEintraege ? '#e8f8ed' : 'white');
                    const color = istAktiv ? 'white' : '#333';
                    const border = istAktiv ? '#0056b3' : (hatEintraege ? '#28a745' : '#ccc');

                    html += `
                        <button type="button" onclick="tpTagSetzen('${tagStr}')" 
                                style="padding: 6px 2px; border: 1px solid ${border}; background: ${bg}; color: ${color}; border-radius: 6px; cursor: pointer; font-size: 12px; line-height: 1.3;">
                            <strong>${tageNamen[i]}</strong><br>
                            ${tagDatum.getDate()}.${tagDatum.getMonth() + 1}.
                        </button>`;
                }
                container.innerHTML = html;
            };

            // Springt direkt auf einen angeklickten Wochentag
            window.tpTagSetzen = function(datumStr) {
                datumFeld.value = datumStr;
                tpZeichnen();
            };

            // Blättert 7 Tage vor oder zurück
            window.tpWocheWechseln = function(tageDelta) {
                const teile = datumFeld.value.split('-');
                const d = new Date(teile.at(0), teile.at(1) - 1, teile.at(2));
                d.setDate(d.getDate() + tageDelta);
                datumFeld.value = formatDatum(d);
                tpZeichnen();
            };

            // Springt sofort zurück auf heute
            window.tpHeuteWaehlen = function() {
                datumFeld.value = formatDatum(new Date());
                tpZeichnen();
            };

            // Verknüpft die Wochenleiste automatisch mit dem Neuzeichnen des Tagesplans
            const originalTpZeichnen = window.tpZeichnen;
            window.tpZeichnen = function() {
                originalTpZeichnen();
                tpWochenLeisteZeichnen();
            };

            // Direkt beim Laden einmal ausführen
            tpWochenLeisteZeichnen();
        })();
    </script>

    <!-- BAUSTEIN 6: TAGES-KALORIENZIEL & 5-STUFEN-FARBSKALA                   -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            const datumFeld = document.getElementById('tp-datum');
            const hauptwerteBox = document.getElementById('tp-hauptwerte');
            if (!datumFeld || !hauptwerteBox) return;

            if (!AppDaten.kcalZiele) AppDaten.kcalZiele = { standard: 2000, proTag: {} };

            // Eingabefeld für das Kalorienziel oben in die Tagesbilanz-Box einfügen
            const bilanzKarte = hauptwerteBox.parentElement;
            const zielZeile = document.createElement('div');
            zielZeile.style.cssText = 'display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(0,0,0,0.1);';
            zielZeile.innerHTML = `
                <label style="font-size: 13px; font-weight: bold; white-space: nowrap;">🎯 Tagesziel (kcal):</label>
                <input type="number" id="tp-kcal-ziel" style="margin: 0; padding: 6px; font-size: 14px;" placeholder="z.B. 2000" onchange="tpZielSpeichern()" onkeyup="tpZielSpeichern()">
                <span id="tp-ziel-differenz" style="font-size: 13px; font-weight: bold; white-space: nowrap;"></span>
            `;
            bilanzKarte.insertBefore(zielZeile, bilanzKarte.firstChild);

            function holeZielFuerTag(datumStr) {
                if (AppDaten.kcalZiele.proTag && AppDaten.kcalZiele.proTag[datumStr] !== undefined) {
                    return AppDaten.kcalZiele.proTag[datumStr];
                }
                return AppDaten.kcalZiele.standard || 0;
            }

            function berechneTagesKcal(datumStr) {
                const eintraege = AppDaten.tagesplan[datumStr] || [];
                const spKcal = AppDaten.naehrstoffSpalten.find(s => ['kcal', 'kalorien', 'energie'].some(w => s.toLowerCase().includes(w)));
                if (!spKcal) return 0;
                return eintraege.reduce((sum, e) => sum + ((e.wertePro100g[spKcal] || 0) * (e.gramm / 100)), 0);
            }

            // Deine exakten 5 Farbstufen
            function ermittleFarbStufe(diff) {
                if (diff >= -100 && diff <= 50) {
                    // Zielbereich (-100 bis +50): Sattes Grün
                    return { voll: '#198754', hell: '#c3e6cb', text: '#0f5132', label: `✅ Zielbereich (${diff >= 0 ? '+' : ''}${diff.toFixed(0)} kcal)` };
                } else if (diff > 50 && diff <= 150) {
                    // Leicht drüber (+50 bis +150): Mischung aus Grün und Orange
                    return { voll: '#d9822b', hell: '#f5e1b5', text: '#663c00', label: `🟠 Leicht drüber (+${diff.toFixed(0)} kcal)` };
                } else if (diff > 150) {
                    // Über +150 drüber: Rot
                    return { voll: '#dc3545', hell: '#f8d7da', text: '#721c24', label: `🔴 +${diff.toFixed(0)} kcal drüber` };
                } else if (diff >= -200 && diff < -100) {
                    // Zwischen -100 und -200 im Minus: Blaugrün
                    return { voll: '#0d9488', hell: '#ccfbf1', text: '#115e59', label: `🩵 Noch ${Math.abs(diff).toFixed(0)} kcal offen` };
                } else {
                    // Weiter als 200 im Minus: Neutrales Blau
                    return { voll: '#007bff', hell: '#e7f3ff', text: '#004085', label: `🔵 Noch ${Math.abs(diff).toFixed(0)} kcal offen` };
                }
            }

            window.tpZielSpeichern = function() {
                const wert = parseFloat(document.getElementById('tp-kcal-ziel').value);
                const datumStr = datumFeld.value;
                if (!isNaN(wert) && wert >= 0) {
                    AppDaten.kcalZiele.proTag[datumStr] = wert;
                    AppDaten.kcalZiele.standard = wert;
                    speichereDaten();
                    tpAmpelAktualisieren();
                }
            };

            window.tpAmpelAktualisieren = function() {
                const datumStr = datumFeld.value;
                const ziel = holeZielFuerTag(datumStr);
                const gegessen = berechneTagesKcal(datumStr);

                const zielInput = document.getElementById('tp-kcal-ziel');
                if (zielInput && document.activeElement !== zielInput) {
                    zielInput.value = ziel || '';
                }

                const diffSpan = document.getElementById('tp-ziel-differenz');

                if (!ziel || ziel <= 0) {
                    bilanzKarte.style.background = '#eef5ff';
                    bilanzKarte.style.borderColor = '#cce0ff';
                    if (diffSpan) diffSpan.innerText = '';
                } else {
                    const stufe = ermittleFarbStufe(gegessen - ziel);
                    bilanzKarte.style.background = stufe.hell;
                    bilanzKarte.style.borderColor = stufe.voll;
                    if (diffSpan) {
                        diffSpan.style.color = stufe.text;
                        diffSpan.innerText = stufe.label;
                    }
                }

                // Auch die Wochentags-Buttons (Mo–So) passend einfärben
                document.querySelectorAll('#tp-wochentage button').forEach(btn => {
                    const onclickText = btn.getAttribute('onclick') || '';
                    const start = onclickText.indexOf("'");
                    const ende = onclickText.lastIndexOf("'");
                    if (start === -1 || ende <= start) return;

                    const btnDatum = onclickText.slice(start + 1, ende);
                    const istAktiv = (btnDatum === datumStr);
                    const btnEintraege = AppDaten.tagesplan[btnDatum] || [];
                    if (btnEintraege.length === 0) return;

                    const btnZiel = holeZielFuerTag(btnDatum);
                    if (!btnZiel || btnZiel <= 0) return;

                    const btnKcal = berechneTagesKcal(btnDatum);
                    const stufe = ermittleFarbStufe(btnKcal - btnZiel);

                    if (istAktiv) {
                        btn.style.background = stufe.voll;
                        btn.style.borderColor = stufe.voll;
                        btn.style.color = 'white';
                    } else {
                        btn.style.background = stufe.hell;
                        btn.style.borderColor = stufe.voll;
                        btn.style.color = stufe.text;
                    }
                });
            };

            // Fest mit dem Neuzeichnen des Tagesplans verknüpfen
            const basisZeichnen = window.tpZeichnen;
            window.tpZeichnen = function() {
                basisZeichnen();
                tpAmpelAktualisieren();
            };

            tpAmpelAktualisieren();
        })();
    </script>

    <!-- BAUSTEIN 8: MAKRO-PROZENTAUFTEILUNG (KH% / Protein% / Fett% -> Gramm) -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            const datumFeld = document.getElementById('tp-datum');
            const hauptwerteBox = document.getElementById('tp-hauptwerte');
            const zielInput = document.getElementById('tp-kcal-ziel');
            if (!datumFeld || !hauptwerteBox || !zielInput) return;

            // Speicherstruktur für Makro-Prozente in AppDaten anlegen (wird im Backup mitgesichert)
            if (!AppDaten.makroZiele) {
                AppDaten.makroZiele = {
                    standard: { kh: 30, prot: 50, fett: 20 },
                    proTag: {}
                };
            }

            // Neue Eingabezeile für KH %, Protein % und Fett % direkt unter das Kalorienziel setzen
            const zielZeile = zielInput.parentElement;
            const makroZeile = document.createElement('div');
            makroZeile.style.cssText = 'margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(0,0,0,0.1); font-size: 13px;';
            makroZeile.innerHTML = `
                <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                    <strong>📊 Aufteilung (%):</strong>
                    <label>KH <input type="number" id="tp-proz-kh" style="width: 55px; margin: 0; padding: 4px; text-align: center;" onchange="tpMakroSpeichern()" onkeyup="tpMakroSpeichern()">%</label>
                    <label>Prot <input type="number" id="tp-proz-prot" style="width: 55px; margin: 0; padding: 4px; text-align: center;" onchange="tpMakroSpeichern()" onkeyup="tpMakroSpeichern()">%</label>
                    <label>Fett <input type="number" id="tp-proz-fett" style="width: 55px; margin: 0; padding: 4px; text-align: center;" onchange="tpMakroSpeichern()" onkeyup="tpMakroSpeichern()">%</label>
                    <span id="tp-proz-summe" style="font-weight: bold;"></span>
                </div>
                <div id="tp-makro-gramm-ziele" style="margin-top: 6px; color: #333; font-size: 13px;"></div>
            `;
            zielZeile.parentElement.insertBefore(makroZeile, zielZeile.nextSibling);

            // Hilfsfunktion: Holt die gültigen Prozentwerte für ein Datum
            function holeMakroProzente(datumStr) {
                if (AppDaten.makroZiele.proTag && AppDaten.makroZiele.proTag[datumStr]) {
                    return AppDaten.makroZiele.proTag[datumStr];
                }
                return AppDaten.makroZiele.standard || { kh: 30, prot: 50, fett: 20 };
            }

            // Speichert geänderte Prozentwerte für diesen Tag (und merkt sie als neuen Standard)
            window.tpMakroSpeichern = function() {
                const datumStr = datumFeld.value;
                const kh = parseFloat(document.getElementById('tp-proz-kh').value) || 0;
                const prot = parseFloat(document.getElementById('tp-proz-prot').value) || 0;
                const fett = parseFloat(document.getElementById('tp-proz-fett').value) || 0;

                const neu = { kh: kh, prot: prot, fett: fett };
                AppDaten.makroZiele.proTag[datumStr] = neu;
                AppDaten.makroZiele.standard = neu;
                speichereDaten();
                tpMakroZieleAktualisieren();
            };

            // Berechnet aus Kalorienziel & Prozenten die Gramm-Ziele und zeigt Ist vs. Soll an
            window.tpMakroZieleAktualisieren = function() {
                const datumStr = datumFeld.value;
                const proz = holeMakroProzente(datumStr);

                // Eingabefelder befüllen (sofern der Nutzer nicht gerade aktiv hineintippt)
                const fKh = document.getElementById('tp-proz-kh');
                const fProt = document.getElementById('tp-proz-prot');
                const fFett = document.getElementById('tp-proz-fett');
                if (document.activeElement !== fKh) fKh.value = proz.kh;
                if (document.activeElement !== fProt) fProt.value = proz.prot;
                if (document.activeElement !== fFett) fFett.value = proz.fett;

                // Summe der Prozente prüfen (sollte 100% ergeben)
                const summeProz = proz.kh + proz.prot + proz.fett;
                const summeSpan = document.getElementById('tp-proz-summe');
                if (Math.abs(summeProz - 100) < 0.1) {
                    summeSpan.style.color = '#198754';
                    summeSpan.innerText = '(= 100%)';
                } else {
                    summeSpan.style.color = '#dc3545';
                    summeSpan.innerText = `(⚠️ Summe: ${summeProz}% statt 100%)`;
                }

                // Tageskalorien-Ziel ermitteln
                const zielKcal = (AppDaten.kcalZiele && AppDaten.kcalZiele.proTag && AppDaten.kcalZiele.proTag[datumStr] !== undefined)
                    ? AppDaten.kcalZiele.proTag[datumStr]
                    : (AppDaten.kcalZiele ? AppDaten.kcalZiele.standard : 0);

                const ausgabeBox = document.getElementById('tp-makro-gramm-ziele');
                if (!zielKcal || zielKcal <= 0) {
                    ausgabeBox.innerHTML = '<span style="color: #666;">Bitte oben ein Kalorienziel eingeben, um die Gramm-Ziele zu berechnen.</span>';
                    return;
                }

                // Ziel-Gramm berechnen (KH & Protein = 4,1 kcal/g, Fett = 9,3 kcal/g)
                const zielKhGramm   = (zielKcal * (proz.kh / 100)) / 4.1;
                const zielProtGramm = (zielKcal * (proz.prot / 100)) / 4.1;
                const zielFettGramm = (zielKcal * (proz.fett / 100)) / 9.3;

                // Bisher gegessene Makros für diesen Tag berechnen
                const eintraege = AppDaten.tagesplan[datumStr] || [];
                const findeSpalte = (woerter) => AppDaten.naehrstoffSpalten.find(s => woerter.some(w => s.toLowerCase().includes(w)));
                const spKh   = findeSpalte(['kohlenhydrat', 'kh']);
                const spProt = findeSpalte(['protein', 'eiweiß', 'eiweiss']);
                const spFett = findeSpalte(['fett']);

                const istKh   = spKh   ? eintraege.reduce((s, e) => s + ((e.wertePro100g[spKh] || 0) * e.gramm / 100), 0) : 0;
                const istProt = spProt ? eintraege.reduce((s, e) => s + ((e.wertePro100g[spProt] || 0) * e.gramm / 100), 0) : 0;
                const istFett = spFett ? eintraege.reduce((s, e) => s + ((e.wertePro100g[spFett] || 0) * e.gramm / 100), 0) : 0;

                // Kompakte Ist / Soll Übersicht direkt in der Tagesbilanz anzeigen
                ausgabeBox.innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: rgba(255,255,255,0.65); padding: 6px 8px; border-radius: 6px; text-align: center;">
                        <div><strong>KH:</strong><br>${istKh.toFixed(0)} / <strong>${zielKhGramm.toFixed(0)} g</strong></div>
                        <div><strong>Protein:</strong><br>${istProt.toFixed(0)} / <strong>${zielProtGramm.toFixed(0)} g</strong></div>
                        <div><strong>Fett:</strong><br>${istFett.toFixed(0)} / <strong>${zielFettGramm.toFixed(0)} g</strong></div>
                    </div>
                `;
            };

            // An Tagesplan-Zeichnen und Kalorienziel-Änderung ankoppeln
            const vorherigesZeichnen = window.tpZeichnen;
            window.tpZeichnen = function() {
                vorherigesZeichnen();
                tpMakroZieleAktualisieren();
            };

            const vorherigesZielSpeichern = window.tpZielSpeichern;
            if (vorherigesZielSpeichern) {
                window.tpZielSpeichern = function() {
                    vorherigesZielSpeichern();
                    tpMakroZieleAktualisieren();
                };
            }

            // Direkt beim Laden einmal ausführen
            tpMakroZieleAktualisieren();
        })();
    </script>

    <!-- BAUSTEIN 9: GEWICHTS-TRACKER & VERLAUFS-DIAGRAMM -->
    <script>
        registriereModul('gewicht', '⚖️ Gewicht', `
            <div style="background: #f9f9f9; border: 1px solid #e0e4e8; border-radius: 8px; padding: 12px; margin-bottom: 15px;">
                <h2 style="margin: 0 0 8px 0; font-size: 18px;">⚖️ Gewicht eintragen</h2>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <input type="date" id="gew-datum" style="flex: 1; min-width: 140px; margin: 0;">
                    <input type="number" step="0.1" id="gew-wert" placeholder="Gewicht in kg (z.B. 82.4)" style="flex: 1; min-width: 140px; margin: 0;">
                </div>
                <button class="action" onclick="gewHinzufuegen()" style="margin-top: 10px; margin-bottom: 0;">Gewicht speichern</button>
            </div>
            <div id="gew-statistik" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px;"></div>
            <div style="background: white; border: 1px solid #e0e4e8; border-radius: 8px; padding: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0 0 8px 0; font-size: 15px; color: #0056b3;">📈 Gewichtsverlauf</h3>
                <div id="gew-diagramm" style="width: 100%; overflow-x: auto;"></div>
            </div>
            <h3 style="margin: 0 0 8px 0; font-size: 16px;">Letzte Einträge (<span id="gew-anzahl">0</span>)</h3>
            <div id="gew-liste"></div>
        `, () => {
            const datumFeld = document.getElementById('gew-datum');
            datumFeld.value = new Date().toISOString().slice(0, 10);

            window.gewHinzufuegen = function() {
                const datum = datumFeld.value;
                const kg = parseFloat(document.getElementById('gew-wert').value);
                if (!datum) return alert('Bitte ein Datum wählen!');
                if (!kg || kg <= 20 || kg > 400) return alert('Bitte ein gültiges Gewicht in kg eingeben!');
                const vorhanden = AppDaten.gewicht.find(g => g.datum === datum);
                if (vorhanden) { vorhanden.kg = kg; } else { AppDaten.gewicht.push({ id: Date.now(), datum: datum, kg: kg }); }
                AppDaten.gewicht.sort((a, b) => a.datum.localeCompare(b.datum));
                speichereDaten();
                document.getElementById('gew-wert').value = '';
                gewZeichnen();
            };

            window.gewLoeschen = function(id) {
                if (!confirm('Diesen Gewichtseintrag wirklich löschen?')) return;
                AppDaten.gewicht = AppDaten.gewicht.filter(g => g.id !== id);
                speichereDaten();
                gewZeichnen();
            };
            window.gewZeichnen = function() {
                const daten = AppDaten.gewicht || [];
                document.getElementById('gew-anzahl').innerText = daten.length;
                const statBox = document.getElementById('gew-statistik');
                const diaBox = document.getElementById('gew-diagramm');
                const listeBox = document.getElementById('gew-liste');

                if (daten.length === 0) {
                    statBox.innerHTML = '';
                    diaBox.innerHTML = '<div style="font-size: 13px; color: #888; padding: 20px 0; text-align: center;">Trage mindestens 2 Gewichtswerte ein, um deine Verlaufskurve zu sehen.</div>';
                    listeBox.innerHTML = '<div style="font-size: 13px; color: #888;">Noch keine Gewichtswerte gespeichert.</div>';
                    return;
                }

                const startKg = daten.at(0).kg;
                const aktuellKg = daten.at(-1).kg;
                const diffKg = aktuellKg - startKg;
                const diffFarbe = diffKg <= 0 ? '#198754' : '#dc3545';
                const diffVorzeichen = diffKg > 0 ? '+' : '';

                statBox.innerHTML = `
                    <div style="background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; padding: 8px; text-align: center;"><div style="font-size: 11px; color: #666;">Start</div><strong style="font-size: 15px;">${startKg.toFixed(1)} kg</strong></div>
                    <div style="background: #eef5ff; border: 1px solid #cce0ff; border-radius: 6px; padding: 8px; text-align: center;"><div style="font-size: 11px; color: #0056b3;">Aktuell</div><strong style="font-size: 15px; color: #0056b3;">${aktuellKg.toFixed(1)} kg</strong></div>
                    <div style="background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; padding: 8px; text-align: center;"><div style="font-size: 11px; color: #666;">Verlauf</div><strong style="font-size: 15px; color: ${diffFarbe};">${diffVorzeichen}${diffKg.toFixed(1)} kg</strong></div>
                `;

                if (daten.length === 1) {
                    diaBox.innerHTML = '<div style="font-size: 13px; color: #666; padding: 15px 0; text-align: center;">Noch 1 weiteren Wert eintragen, dann erscheint hier die Linie!</div>';
                } else {
                    const breite = Math.max(320, daten.length * 45), hoehe = 180;
                    const randLinks = 38, randRechts = 20, randOben = 20, randUnten = 28;
                    const nutzBreite = breite - randLinks - randRechts, nutzHoehe = hoehe - randOben - randUnten;
                    const alleKg = daten.map(d => d.kg);
                    const minKg = Math.floor(Math.min(...alleKg) - 0.5), maxKg = Math.ceil(Math.max(...alleKg) + 0.5);
                    const spanne = (maxKg - minKg) || 1;

                    const punkte = daten.map((d, index) => ({
                        x: randLinks + (index / (daten.length - 1)) * nutzBreite,
                        y: randOben + nutzHoehe - ((d.kg - minKg) / spanne) * nutzHoehe,
                        kg: d.kg, datum: d.datum
                    }));

                    const linienPfad = punkte.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
                    const midKg = (minKg + maxKg) / 2;
                    const hilfsLinien = [{ wert: maxKg, y: randOben }, { wert: midKg, y: randOben + nutzHoehe / 2 }, { wert: minKg, y: randOben + nutzHoehe }].map(h =>
                        `<line x1="${randLinks}" y1="${h.y}" x2="${breite - randRechts}" y2="${h.y}" stroke="#eee" stroke-width="1"/><text x="${randLinks - 5}" y="${h.y + 4}" font-size="10" fill="#666" text-anchor="end">${h.wert.toFixed(1)}</text>`
                    ).join('');

                    const punkteHTML = punkte.map(p => {
                        const teile = p.datum.split('-');
                        return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#007bff"/><text x="${p.x.toFixed(1)}" y="${(p.y - 7).toFixed(1)}" font-size="10" font-weight="bold" fill="#333" text-anchor="middle">${p.kg.toFixed(1)}</text><text x="${p.x.toFixed(1)}" y="${hoehe - 8}" font-size="9" fill="#666" text-anchor="middle">${teile.at(2)}.${teile.at(1)}.</text>`;
                    }).join('');

                    diaBox.innerHTML = `<svg width="${breite}" height="${hoehe}" style="display: block;">${hilfsLinien}<polyline fill="none" stroke="#007bff" stroke-width="2.5" points="${linienPfad}"/>${punkteHTML}</svg>`;
                }

                const rueckwaerts = [...daten].reverse();
                listeBox.innerHTML = rueckwaerts.map((g, idx) => {
                    const teile = g.datum.split('-');
                    const vorher = rueckwaerts[idx + 1];
                    let diffText = '';
                    if (vorher) {
                        const d = g.kg - vorher.kg;
                        diffText = `<span style="font-size: 12px; color: ${d <= 0 ? '#198754' : '#dc3545'}; margin-left: 8px;">(${d > 0 ? '+' : ''}${d.toFixed(1)} kg)</span>`;
                    }
                    return `<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border: 1px solid #eee; border-radius: 6px; margin-bottom: 6px; background: #fafbfc;"><div><span style="font-size: 13px; color: #555;">${teile.at(2)}.${teile.at(1)}.${teile.at(0)}:</span><strong style="margin-left: 6px;">${g.kg.toFixed(1)} kg</strong>${diffText}</div><button onclick="gewLoeschen(${g.id})" style="background: #dc3545; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer;">✕</button></div>`;
                }).join('');
            };
            gewZeichnen();
        });
    </script>

    <script>
        registriereModul('rezepte', '🍲 Rezepte', `
            <div style="background: #eef5ff; border: 1px solid #cce0ff; border-radius: 8px; padding: 12px; margin-bottom: 15px;">
                <h3 style="margin: 0 0 8px 0; font-size: 16px; color: #0056b3;">📖 Rezept-Vorlage wählen oder neu kochen</h3>

                    <select id="rez-auswahl" style="margin: 0;" onchange="rezVorlageLaden()">

                    <button type="button" onclick="rezVorlageLoeschen()" style="background: #dc3545; color: white; border: none; border-radius: 6px; padding: 0 12px; cursor: pointer;">🗑️</button>

                <input type="text" id="rez-name" placeholder="Name des Rezepts (z.B. Gemüsesuppe)" style="margin-top: 8px;">

            <div style="background: #f9f9f9; border: 1px solid #e0e4e8; border-radius: 8px; padding: 12px; margin-bottom: 15px;">
                <h3 style="margin: 0 0 8px 0; font-size: 16px;">🥕 Zutaten im Topf (Mengen live änderbar)</h3>
                <input type="text" id="rez-lm-filter" placeholder="🔍 Zutat suchen..." onkeyup="rezDropdownFuellen()" style="margin-bottom: 4px;">
                <select id="rez-lm-auswahl"></select>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="rez-zutat-gramm" placeholder="Menge in g" style="margin: 0;">
                    <button class="action" onclick="rezZutatHinzufuegen()" style="margin: 0; white-space: nowrap;">+ Zutat</button>
                </div>
                <div id="rez-zutaten-liste" style="margin-top: 12px;"></div>
                <button type="button" onclick="rezAlsVorlageSpeichern()" style="width: 100%; margin-top: 12px; padding: 10px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                    💾 Rezept als Vorlage speichern / aktualisieren
                </button>
            </div>

            <div style="background: #e8f8ed; border: 1px solid #b7ebc6; border-radius: 8px; padding: 12px;">
                <h3 style="margin: 0 0 8px 0; font-size: 16px; color: #1e7e34;">⚖️ Fertiges Gericht wiegen & Portion eintragen</h3>
                <label style="font-size: 13px; font-weight: bold;">1. Verwendeter Topf / Gefäß:</label>
                <select id="rez-topf-auswahl" onchange="rezBerechnen()">
                    <option value="0">-- Kein Topf / Netto-Gewicht direkt eingeben --</option>
                </select>
                <label style="font-size: 13px; font-weight: bold;">2. Gewicht auf der Waage (Topf + Inhalt in g):</label>
                <input type="number" id="rez-gesamt-waage" placeholder="Gesamtgewicht in g (leer = Rohgewicht-Summe)" onkeyup="rezBerechnen()" onchange="rezBerechnen()">
                <div id="rez-100g-ergebnis" style="background: white; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; border: 1px solid #c3e6cb;"></div>
                <label style="font-size: 13px; font-weight: bold;">3. Herausgewogene Portion in den Tagesplan:</label>
                <select id="rez-ziel-mahlzeit">
                    <option value="Frühstück">🍳 Frühstück</option>
                    <option value="Mittagessen" selected>🍲 Mittagessen</option>
                    <option value="Abendessen">🥗 Abendessen</option>
                    <option value="Snack">🍎 Snack</option>
                </select>
                <input type="number" id="rez-portion-gramm" placeholder="Deine Portion in Gramm (z.B. 350)">
                <button class="action" onclick="rezPortionInTagesplan()">✅ Portion in den Tagesplan eintragen</button>
            </div>
        `, () => {
            let aktuelleZutaten = [];
            let berechneteWertePro100g = {};

            window.rezTopfDropdownAktualisieren = function() {
                const select = document.getElementById('rez-topf-auswahl');
                if (!select) return;
                const alterWert = select.value;
                select.innerHTML = '<option value="0">-- Kein Topf / Netto-Gewicht direkt eingeben --</option>' +
                    AppDaten.toepfe.map(t => `<option value="${t.gewicht}">${t.name} (Tara: ${t.gewicht} g)</option>`).join('');
                select.value = alterWert || "0";
            };

            if (window.toepfeZeichnen) {
                const basisToepfeZeichnen = window.toepfeZeichnen;
                window.toepfeZeichnen = function() {
                    basisToepfeZeichnen();
                    rezTopfDropdownAktualisieren();
                };
            }

            window.rezVorlagenDropdownFuellen = function() {
                const select = document.getElementById('rez-auswahl');
                select.innerHTML = '<option value="">-- Neues leeres Rezept --</option>' +
                    AppDaten.rezepte.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            };

            window.rezAlsVorlageSpeichern = function() {
                const name = document.getElementById('rez-name').value.trim();
                if (!name) return alert('Bitte gib dem Rezept oben einen Namen!');
                if (aktuelleZutaten.length === 0) return alert('Bitte füge zuerst mindestens eine Zutat hinzu!');
                const vorhanden = AppDaten.rezepte.find(r => r.name.toLowerCase() === name.toLowerCase());
                if (vorhanden) { vorhanden.zutaten = JSON.parse(JSON.stringify(aktuelleZutaten)); }
                else { AppDaten.rezepte.push({ id: Date.now(), name: name, zutaten: JSON.parse(JSON.stringify(aktuelleZutaten)) }); }
                AppDaten.rezepte.sort((a, b) => a.name.localeCompare(b.name));
                speichereDaten();
                rezVorlagenDropdownFuellen();
                alert('Rezept "' + name + '" als Vorlage gespeichert!');
            };
            window.rezVorlageLaden = function() {
                const id = parseFloat(document.getElementById('rez-auswahl').value);
                if (!id) { document.getElementById('rez-name').value = ''; aktuelleZutaten = []; }
                else {
                    const rez = AppDaten.rezepte.find(r => r.id === id);
                    if (rez) { document.getElementById('rez-name').value = rez.name; aktuelleZutaten = JSON.parse(JSON.stringify(rez.zutaten)); }
                }
                rezZutatenZeichnen();
            };

            window.rezVorlageLoeschen = function() {
                const id = parseFloat(document.getElementById('rez-auswahl').value);
                if (!id || !confirm('Dieses gespeicherte Rezept wirklich löschen?')) return;
                AppDaten.rezepte = AppDaten.rezepte.filter(r => r.id !== id);
                speichereDaten();
                document.getElementById('rez-name').value = '';
                aktuelleZutaten = [];
                rezVorlagenDropdownFuellen();
                rezZutatenZeichnen();
            };

            window.rezDropdownFuellen = function() {
                const filter = document.getElementById('rez-lm-filter').value.toLowerCase();
                const select = document.getElementById('rez-lm-auswahl');
                const treffer = AppDaten.lebensmittel.filter(lm => lm.name.toLowerCase().includes(filter));
                select.innerHTML = treffer.slice(0, 100).map(lm => `<option value="${lm.id}">${lm.name}</option>`).join('');
            };

            window.rezZutatHinzufuegen = function() {
                const lmId = parseFloat(document.getElementById('rez-lm-auswahl').value);
                const gramm = parseFloat(document.getElementById('rez-zutat-gramm').value);
                if (!lmId || !gramm || gramm <= 0) return alert('Bitte Zutat und Grammzahl eingeben!');
                const lm = AppDaten.lebensmittel.find(item => item.id === lmId);
                if (!lm) return;
                aktuelleZutaten.push({ zutatId: Date.now() + Math.random(), name: lm.name, gramm: gramm, wertePro100g: lm.werte });
                document.getElementById('rez-zutat-gramm').value = '';
                rezZutatenZeichnen();
            };

            window.rezZutatMengeAendern = function(zutatId, neueGramm) {
                const zutat = aktuelleZutaten.find(z => z.zutatId === zutatId);
                if (zutat) { zutat.gramm = parseFloat(neueGramm) || 0; rezBerechnen(); }
            };

            window.rezZutatEntfernen = function(zutatId) {
                aktuelleZutaten = aktuelleZutaten.filter(z => z.zutatId !== zutatId);
                rezZutatenZeichnen();
            };

            window.rezZutatenZeichnen = function() {
                const liste = document.getElementById('rez-zutaten-liste');
                if (aktuelleZutaten.length === 0) {
                    liste.innerHTML = '<div style="font-size: 13px; color: #777;">Noch keine Zutaten im Topf.</div>';
                } else {
                    liste.innerHTML = aktuelleZutaten.map(z => `
                        <div style="display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid #eee;">
                            <span style="flex: 1; font-size: 14px;">${z.name}</span>
                            <input type="number" value="${z.gramm}" onchange="rezZutatMengeAendern(${z.zutatId}, this.value)" onkeyup="rezZutatMengeAendern(${z.zutatId}, this.value)" style="width: 85px; margin: 0; padding: 6px; text-align: right;">
                            <span style="font-size: 13px;">g</span>
                            <button onclick="rezZutatEntfernen(${z.zutatId})" style="background: #dc3545; color: white; border: none; border-radius: 4px; padding: 6px 8px; cursor: pointer;">✕</button>
                        </div>`).join('');
                }
                rezBerechnen();
            };

            window.rezBerechnen = function() {
                const ergebnisBox = document.getElementById('rez-100g-ergebnis');
                if (aktuelleZutaten.length === 0) {
                    ergebnisBox.innerHTML = 'Bitte oben Zutaten hinzufügen, um die Nährwerte zu berechnen.';
                    berechneteWertePro100g = {};
                    return;
                }

                let rohGewichtGesamt = 0;
                const topfSummen = {};
                AppDaten.naehrstoffSpalten.forEach(s => topfSummen[s] = 0);

                aktuelleZutaten.forEach(z => {
                    rohGewichtGesamt += z.gramm;
                    const faktor = z.gramm / 100;
                    for (const [spalte, wert] of Object.entries(z.wertePro100g)) {
                        topfSummen[spalte] = (topfSummen[spalte] || 0) + (wert * faktor);
                    }
                });

                const topfTara = parseFloat(document.getElementById('rez-topf-auswahl').value) || 0;
                const waageBrutto = parseFloat(document.getElementById('rez-gesamt-waage').value) || 0;

                let nettoSpeiseGewicht = rohGewichtGesamt;
                let gewichtsInfo = `Rohgewicht-Summe: ${rohGewichtGesamt.toFixed(0)} g`;

                if (waageBrutto > 0) {
                    nettoSpeiseGewicht = waageBrutto - topfTara;
                    if (nettoSpeiseGewicht <= 0) {
                        ergebnisBox.innerHTML = '<span style="color: #dc3545; font-weight: bold;">⚠️ Waagen-Gewicht ist kleiner als das Topfgewicht!</span>';
                        berechneteWertePro100g = {};
                        return;
                    }
                    gewichtsInfo = `Fertige Speise (Netto): <strong>${nettoSpeiseGewicht.toFixed(0)} g</strong> (Waage ${waageBrutto} g − Topf ${topfTara} g)`;
                }

                berechneteWertePro100g = {};
                const faktor100g = 100 / nettoSpeiseGewicht;
                for (const [spalte, gesamtWert] of Object.entries(topfSummen)) {
                    berechneteWertePro100g[spalte] = gesamtWert * faktor100g;
                }

                const findeSpalte = (woerter) => AppDaten.naehrstoffSpalten.find(s => woerter.some(w => s.toLowerCase().includes(w)));
                const spKcal = findeSpalte(['kcal', 'kalorien', 'energie']);
                const spKh   = findeSpalte(['kohlenhydrat', 'kh']);
                const spProt = findeSpalte(['protein', 'eiweiß', 'eiweiss']);
                const spFett = findeSpalte(['fett']);

                ergebnisBox.innerHTML = `
                    <div style="margin-bottom: 6px; color: #555;">${gewichtsInfo}</div>
                    <strong>Nährwerte pro 100g fertige Speise:</strong><br>
                    ${spKcal ? `${spKcal}: <strong>${berechneteWertePro100g[spKcal].toFixed(1)}</strong> | ` : ''}
                    ${spKh ? `KH: <strong>${berechneteWertePro100g[spKh].toFixed(1)}g</strong> | ` : ''}
                    ${spProt ? `P: <strong>${berechneteWertePro100g[spProt].toFixed(1)}g</strong> | ` : ''}
                    ${spFett ? `F: <strong>${berechneteWertePro100g[spFett].toFixed(1)}g</strong>` : ''}
                `;
            };

            window.rezPortionInTagesplan = function() {
                const portionGramm = parseFloat(document.getElementById('rez-portion-gramm').value);
                if (!portionGramm || portionGramm <= 0) return alert('Bitte deine Portionsgröße in Gramm eingeben!');
                if (Object.keys(berechneteWertePro100g).length === 0) return alert('Bitte zuerst ein Rezept berechnen!');

                const rezeptName = document.getElementById('rez-name').value.trim() || 'Selbstgekochtes Rezept';
                const mahlzeit = document.getElementById('rez-ziel-mahlzeit').value;
                const datumFeld = document.getElementById('tp-datum');
                const zielDatum = datumFeld ? datumFeld.value : new Date().toISOString().slice(0, 10);

                if (!AppDaten.tagesplan[zielDatum]) AppDaten.tagesplan[zielDatum] = [];

                AppDaten.tagesplan[zielDatum].push({
                    eintragId: Date.now(),
                    mahlzeit: mahlzeit,
                    name: '🍲 ' + rezeptName,
                    gramm: portionGramm,
                    wertePro100g: JSON.parse(JSON.stringify(berechneteWertePro100g))
                });

                speichereDaten();
                document.getElementById('rez-portion-gramm').value = '';
                if (window.tpZeichnen) tpZeichnen();
                alert(`✅ ${portionGramm}g "${rezeptName}" wurden unter ${mahlzeit} (${zielDatum}) eingetragen!`);
            };

            rezTopfDropdownAktualisieren();
            rezVorlagenDropdownFuellen();
            rezDropdownFuellen();
            rezZutatenZeichnen();
        });
    </script>

    <script>
        (function() {

            if (!mahlzeitSelect) return;

            // Erstellt ein eigenes Datumsfeld direkt oberhalb der Mahlzeiten-Auswahl im Rezept-Tab
            const datumsWrapper = document.createElement('div');
            datumsWrapper.style.cssText = 'margin-bottom: 6px;';
            datumsWrapper.innerHTML = `
                <label style="font-size: 13px; font-weight: bold;">Für welchen Tag einplanen:</label>
                <input type="date" id="rez-ziel-datum" style="margin-top: 4px; margin-bottom: 6px;">
            `;
            mahlzeitSelect.parentElement.insertBefore(datumsWrapper, mahlzeitSelect);

            // Standardmäßig heutiges Datum eintragen
            const rezDatumFeld = document.getElementById('rez-ziel-datum');
            rezDatumFeld.value = new Date().toISOString().slice(0, 10);

            // Erweitert den "Portion in den Tagesplan"-Button, sodass er genau dieses gewählte Datum nutzt
            const originalPortionFunktion = window.rezPortionInTagesplan;
            if (originalPortionFunktion) {
                window.rezPortionInTagesplan = function() {
                    const gewaehltesDatum = rezDatumFeld.value;
                    const tpDatumFeld = document.getElementById('tp-datum');

                    // Setzt das Tagesplan-Datum kurz auf das im Rezept gewählte Ziel-Datum (z.B. Donnerstag)
                    if (tpDatumFeld && gewaehltesDatum) {
                        tpDatumFeld.value = gewaehltesDatum;
                    }

                    // Führt die gewohnte Speicherung & Berechnung aus
                    originalPortionFunktion();
                };
            }
        })();
    </script>

    <!-- BAUSTEIN 12: NEUES LEBENSMITTEL ANLEGEN & EXCEL-CSV-EXPORT            -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            const lmModul = document.getElementById('modul-lebensmittel');
            if (!lmModul) return;

            // 1. Neuen Bereich ganz oben im Tab "Lebensmittel & CSV" einfügen
            const neuBox = document.createElement('div');
            neuBox.style.cssText = 'background: #e8f8ed; border: 1px solid #b7ebc6; border-radius: 8px; padding: 12px; margin-bottom: 15px;';
            neuBox.innerHTML = `
                <button type="button" onclick="lmNeuFormularOeffnen()" 
                        style="width: 100%; background: none; border: none; text-align: left; font-weight: bold; font-size: 15px; color: #1e7e34; cursor: pointer; padding: 0;">
                    ➕ Neues Lebensmittel direkt in der App anlegen ▼
                </button>
                <div id="lm-neu-formular" style="display: none; margin-top: 12px; padding-top: 10px; border-top: 1px solid #b7ebc6;">
                    <input type="text" id="lm-neu-name" placeholder="Name des Lebensmittels (z.B. Skyr Natur)" style="font-weight: bold;">
                    <p style="font-size: 12px; color: #555; margin: 0 0 8px 0;">Nährwerte pro 100g eintragen (leere Felder = 0):</p>
                    <div id="lm-neu-felder" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: 280px; overflow-y: auto; padding-right: 4px; margin-bottom: 10px;"></div>
                    <button class="action" onclick="lmManuellSpeichern()" style="margin-bottom: 0;">✅ Neues Lebensmittel speichern</button>
                </div>
            `;
            lmModul.insertBefore(neuBox, lmModul.firstChild);

            // 2. CSV-Export-Button direkt unter den CSV-Import-Status setzen
            const csvStatus = document.getElementById('csv-status');
            if (csvStatus) {
                const exportBtn = document.createElement('button');
                exportBtn.type = 'button';
                exportBtn.innerText = '📤 Aktuelle Lebensmittel-Liste wieder als Excel-CSV herunterladen';
                exportBtn.style.cssText = 'width: 100%; padding: 10px; margin-bottom: 10px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;';
                exportBtn.onclick = function() {
                    if (AppDaten.lebensmittel.length === 0) return alert('Keine Lebensmittel zum Exportieren vorhanden!');
                    const spalten = AppDaten.naehrstoffSpalten;
                    // Kopfzeile mit Semikolon bauen
                    const zeilen = [['Lebensmittel', ...spalten].join(';')];
                    // Alle Lebensmittel-Zeilen mit deutschem Dezimalkomma bauen
                    AppDaten.lebensmittel.forEach(lm => {
                        const werteZeile = spalten.map(s => String(lm.werte[s] || 0).replace('.', ','));
                        zeilen.push([lm.name, ...werteZeile].join(';'));
                    });
                    // Mit UTF-8 BOM speichern, damit Excel alle Umlaute (ä, ö, ü) direkt richtig öffnet
                    const csvInhalt = '\uFEFF' + zeilen.join('\r\n');
                    const blob = new Blob([csvInhalt], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'lebensmittel-aktualisiert-' + new Date().toISOString().slice(0, 10) + '.csv';
                    link.click();
                };
                csvStatus.parentElement.insertBefore(exportBtn, csvStatus.nextSibling);
            }

            // Öffnet das Eingabeformular und baut automatisch alle 40 Nährstoff-Felder auf
            window.lmNeuFormularOeffnen = function() {
                const form = document.getElementById('lm-neu-formular');
                const wirdGeoeffnet = (form.style.display === 'none');
                form.style.display = wirdGeoeffnet ? 'block' : 'none';

                if (wirdGeoeffnet) {
                    const felderContainer = document.getElementById('lm-neu-felder');
                    // Falls noch keine CSV geladen wurde, zumindest die 5 Standardfelder anbieten
                    const spalten = (AppDaten.naehrstoffSpalten && AppDaten.naehrstoffSpalten.length > 0)
                        ? AppDaten.naehrstoffSpalten
                        : ['Kalorien (kcal)', 'Kohlenhydrate (g)', 'Protein (g)', 'Fett (g)', 'Ballaststoffe (g)'];
                    
                    if (AppDaten.naehrstoffSpalten.length === 0) AppDaten.naehrstoffSpalten = spalten;

                    felderContainer.innerHTML = spalten.map((spalte, idx) => `
                        <div style="background: white; padding: 6px; border-radius: 6px; border: 1px solid #ddd;">
                            <label style="display: block; font-size: 11px; color: #444; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${spalte}">${spalte}</label>
                            <input type="number" step="0.01" id="lm-neu-wert-${idx}" placeholder="0" style="margin: 0; padding: 5px; font-size: 14px;">
                        </div>
                    `).join('');
                }
            };

            // Speichert das neu eingetragene Lebensmittel und aktualisiert alle Dropdowns sofort
            window.lmManuellSpeichern = function() {
                const nameFeld = document.getElementById('lm-neu-name');
                const name = nameFeld.value.trim();
                if (!name) return alert('Bitte gib dem Lebensmittel einen Namen!');

                const werteObjekt = {};
                AppDaten.naehrstoffSpalten.forEach((spalte, idx) => {
                    const feld = document.getElementById('lm-neu-wert-' + idx);
                    werteObjekt[spalte] = feld ? (parseFloat(feld.value) || 0) : 0;
                });

                AppDaten.lebensmittel.push({
                    id: Date.now(),
                    name: name,
                    werte: werteObjekt
                });

                // Alphabetisch sortieren, damit du es schnell wiederfindest
                AppDaten.lebensmittel.sort((a, b) => a.name.localeCompare(b.name));
                speichereDaten();

                // Eingabefelder leeren & Formular schließen
                nameFeld.value = '';
                document.getElementById('lm-neu-formular').style.display = 'none';

                // Alle Listen & Dropdowns in der gesamten App sofort aktualisieren
                if (window.lmListeZeichnen) lmListeZeichnen();
                if (window.tpDropdownFuellen) tpDropdownFuellen();
                if (window.rezDropdownFuellen) rezDropdownFuellen();

                alert(`✅ "${name}" wurde gespeichert und ist ab sofort im Tagesplan & Rezept-Rechner verfügbar!`);

    <!-- BAUSTEIN 13: LEBENSMITTEL & TÖPFE BEARBEITEN (Teil A) -->
    <script>

            const originalLmSpeichern = window.lmManuellSpeichern;

                        if (window.lmListeZeichnen) lmListeZeichnen();
                        if (window.tpDropdownFuellen) tpDropdownFuellen();
                        if (window.rezDropdownFuellen) rezDropdownFuellen();

                    } else {

            const originalLmListeZeichnen = window.lmListeZeichnen;

                    const gefiltert = AppDaten.lebensmittel.filter(lm => lm.name.toLowerCase().includes(suchbegriff)).slice(0, 50);

                    gefiltert.forEach((lm, index) => {

                            bar.style.cssText = 'grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #ddd;';
                            bar.innerHTML = `
                                <button type="button" onclick="lmBearbeitenStarten(${lm.id})" style="flex: 1; padding: 6px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">✏️ Bearbeiten</button>
                                <button type="button" onclick="lmLoeschen(${lm.id})" style="padding: 6px 10px; background: #dc3545; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">🗑️ Löschen</button>`;
                            detBox.appendChild(bar);
                        }
                    });
                };
                lmListeZeichnen();
            }

            window.topfBearbeitenStarten = function(topfId) {
                const topf = AppDaten.toepfe.find(t => t.id === topfId);
                if (!topf) return;

                document.getElementById('topf-name').value = topf.name;

            const originalTopfHinzufuegen = window.topfHinzufuegen;

                    if (bearbeiteterTopfId !== null) {
                        const name = document.getElementById('topf-name').value.trim();
                        const gewicht = parseFloat(document.getElementById('topf-gewicht').value);
                        if (!name || !gewicht || gewicht <= 0) return alert('Bitte gültigen Namen und Gewicht eingeben!');
                        const topf = AppDaten.toepfe.find(t => t.id === bearbeiteterTopfId);
                        if (topf) { topf.name = name; topf.gewicht = gewicht; }
                        bearbeiteterTopfId = null;
                        AppDaten.toepfe.sort((a, b) => a.name.localeCompare(b.name));
                        speichereDaten();
                        document.getElementById('topf-name').value = '';
                        document.getElementById('topf-gewicht').value = '';
                        if (window.toepfeZeichnen) toepfeZeichnen();
                    } else {
                        originalTopfHinzufuegen();

                        if (!karte) return;

                            editBtn.onclick = () => topfBearbeitenStarten(t.id);
                            loeschBtn.parentNode.insertBefore(grp, loeschBtn);
                            grp.appendChild(editBtn);
                            grp.appendChild(loeschBtn);
