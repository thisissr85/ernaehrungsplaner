    <!-- BAUSTEIN 14: SCHLIESS-WARNUNG & SMARTES BACKUP                        -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            let ungesicherteAenderungen = false;
            let festeDateiHandle = null; // Merkt sich am PC (Chrome/Edge) die gewählte Backup-Datei zum Überschreiben

            // Kompakte Leiste oben: Erscheint NUR, wenn du etwas geändert hast und noch nicht gesichert wurde
            const warnLeiste = document.createElement('div');
            warnLeiste.style.cssText = 'display: none; background: #fff3cd; border: 1px solid #ffc107; color: #664d03; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; align-items: center; justify-content: space-between; gap: 10px;';
            warnLeiste.innerHTML = `
                <span>⚠️ <strong>Ungesicherte Änderungen</strong></span>
                <button type="button" onclick="smartBackupSpeichern()" style="background: #198754; color: white; border: none; border-radius: 6px; padding: 6px 12px; font-weight: bold; cursor: pointer; white-space: nowrap;">
                    💾 Backup sichern
                </button>
            `;
            document.body.insertBefore(warnLeiste, document.body.firstChild);

            // Speichert entweder direkt in eine feste Datei (überschreibt sie!) oder per Download
            window.smartBackupSpeichern = async function() {
                const datenText = JSON.stringify(AppDaten, null, 2);

                // In Chrome/Edge: Bietet direktes Überschreiben einer einzigen Backup-Datei an
                if (window.showSaveFilePicker) {
                    try {
                        if (!festeDateiHandle) {
                            festeDateiHandle = await window.showSaveFilePicker({
                                suggestedName: 'ernaehrungsplan-backup.json',
                                types: [{ description: 'JSON Backup', accept: { 'application/json': ['.json'] } }]
                            });
                        }
                        const schreiber = await festeDateiHandle.createWritable();
                        await schreiber.write(datenText);
                        await schreiber.close();
                        ungesicherteAenderungen = false;
                        warnLeiste.style.display = 'none';
                        return;
                    } catch (err) {
                        // Falls Nutzer im Dialog auf "Abbrechen" klickt, nichts weiter tun
                        if (err.name === 'AbortError') return;
                    }
                }

                // Fallback für Firefox / iPhone / Android: Klassischer Backup-Download
                if (window.exportiereBackup) {
                    exportiereBackup();
                    ungesicherteAenderungen = false;
                    warnLeiste.style.display = 'none';
                }
            };

            // Klinkt sich in speichereDaten() ein -> aktiviert die Schließ-Warnung bei jeder Änderung
            const basisSpeichern = window.speichereDaten;
            window.speichereDaten = function() {
                basisSpeichern();
                ungesicherteAenderungen = true;
                warnLeiste.style.display = 'flex';
            };

            // Setzt die Warnung auch zurück, wenn du manuell im Backup-Tab sicherst
            const basisExport = window.exportiereBackup;
            if (basisExport) {
                window.exportiereBackup = function() {
                    basisExport();
                    ungesicherteAenderungen = false;
                    warnLeiste.style.display = 'none';
                };
            }

            // Fragt beim Schließen des Browser-Tabs nach, falls noch ungesicherte Änderungen offen sind
            window.addEventListener('beforeunload', function(event) {
                if (ungesicherteAenderungen) {
                    event.preventDefault();
                    event.returnValue = '';
                }
            });
        })();
    </script>

    <!-- BAUSTEIN 15: PORTIONS-AUFTEILER / QUELL-RECHNER (z.B. für Reis/Nudeln)-->
    <!-- ===================================================================== -->
    <script>
        registriereModul('aufteiler', '🍚 Aufteiler', `
            <h2 style="margin-top: 0; font-size: 18px;">🍚 Koch-Aufteiler (Roh ➔ Gekocht)</h2>
            <p style="font-size: 13px; color: #555; margin-top: 0;">
                Trage deine geplanten Rohgewichte pro Portion ein (z.B. 70g, 70g, 50g) und wiege nach dem Kochen das Gesamtgewicht – die App berechnet exakt, wie viel gekochte Masse in jede Dose gehört.
            </p>

            <!-- SCHRITT 1: GEPLANTE ROHGEWICHTE PRO PORTION -->
            <div style="background: #f9f9f9; border: 1px solid #e0e4e8; border-radius: 8px; padding: 12px; margin-bottom: 15px;">
                <h3 style="margin: 0 0 8px 0; font-size: 15px;">1. Geplante Rohgewichte (in g)</h3>
                <div id="auft-zeilen"></div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ccc;">
                    <button type="button" onclick="auftZeileHinzufuegen()" style="padding: 6px 10px; background: #e0e4e8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">+ Portion</button>
                    <div style="font-size: 15px;">Summe Rohgewicht: <strong id="auft-roh-summe" style="color: #0056b3;">0 g</strong></div>
                </div>
            </div>

            <!-- SCHRITT 2: GEKOCHTES GESAMTGEWICHT (OPTIONAL MIT TOPF-TARA) -->
            <div style="background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; margin-bottom: 15px;">
                <h3 style="margin: 0 0 8px 0; font-size: 15px; color: #92400e;">2. Gekochtes Gesamtgewicht wiegen</h3>
                <label style="font-size: 12px; font-weight: bold;">Verwendeter Topf / Sieb (optional):</label>
                <select id="auft-topf-auswahl" onchange="auftBerechnen()" style="margin-bottom: 8px;">
                    <option value="0">-- Kein Topf / Netto-Gewicht direkt eingeben --</option>
                </select>
                <label style="font-size: 12px; font-weight: bold;">Gewicht auf der Waage (in g):</label>
                <input type="number" id="auft-waage-gesamt" placeholder="z.B. 437" onkeyup="auftBerechnen()" onchange="auftBerechnen()" style="margin-bottom: 6px; font-weight: bold;">
                <div id="auft-netto-info" style="font-size: 13px; color: #555;"></div>
            </div>
        `, () => {
            // Standardmäßig direkt 3 Portionen wie auf deinem Screenshot anlegen
            let anzahlPortionen = 3;

            // Synchronisiert das Topf-Dropdown mit deiner gespeicherten Topf-Liste
            window.auftTopfDropdownAktualisieren = function() {
                const select = document.getElementById('auft-topf-auswahl');
                if (!select) return;
                const alterWert = select.value;
                select.innerHTML = '<option value="0">-- Kein Topf / Netto-Gewicht direkt eingeben --</option>' +
                    AppDaten.toepfe.map(t => `<option value="${t.gewicht}">${t.name} (Tara: ${t.gewicht} g)</option>`).join('');
                select.value = alterWert || "0";
            };

            // Klinkt sich in Baustein 4 ein, falls du später neue Töpfe anlegst
            if (window.toepfeZeichnen) {
                const basisToepfe = window.toepfeZeichnen;
                window.toepfeZeichnen = function() {
                    basisToepfe();
                    auftTopfDropdownAktualisieren();
                };
            }

            // Baut die Eingabetabelle (Portion 1..N | Rohgewicht | Ergibt gekocht)
            window.auftTabelleBauen = function() {
                const container = document.getElementById('auft-zeilen');
                // Bestehende Eingaben sichern, falls eine neue Zeile hinzugefügt wird
                const alteWerte = [];
                for (let i = 0; i < anzahlPortionen; i++) {
                    const el = document.getElementById('auft-roh-' + i);
                    alteWerte.push(el ? el.value : '');
                }

                let html = `
                    <div style="display: grid; grid-template-columns: 90px 1fr 1fr; gap: 8px; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 6px; text-align: center;">
                        <div style="text-align: left;">Portion</div>
                        <div style="background: #e9d8fd; color: #44337a; padding: 4px; border-radius: 4px;">Rohgewicht (g)</div>
                        <div style="background: #e9d8fd; color: #44337a; padding: 4px; border-radius: 4px;">Ergibt (g)</div>
                    </div>
                `;

                for (let i = 0; i < anzahlPortionen; i++) {
                    html += `
                        <div style="display: grid; grid-template-columns: 90px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 6px;">
                            <span style="font-size: 14px; font-weight: bold;">Portion ${i + 1}:</span>
                            <input type="number" id="auft-roh-${i}" value="${alteWerte[i]}" placeholder="0" onkeyup="auftBerechnen()" onchange="auftBerechnen()" style="margin: 0; padding: 6px; text-align: center; background: #fefce8;">
                            <div id="auft-ergibt-${i}" style="padding: 6px; text-align: center; font-weight: bold; font-size: 15px; background: #eef5ff; border-radius: 6px; color: #0056b3;">0,0 g</div>
                        </div>
                    `;
                }
                container.innerHTML = html;
                auftBerechnen();
            };

            // Fügt eine weitere Portionszeile hinzu (bis zu 12 Portionen)
            window.auftZeileHinzufuegen = function() {
                if (anzahlPortionen >= 12) return;
                anzahlPortionen++;
                auftTabelleBauen();
            };

            // Rechnet live alle "Ergibt"-Werte aus
            window.auftBerechnen = function() {
                let rohSumme = 0;
                const rohWerte = [];

                for (let i = 0; i < anzahlPortionen; i++) {
                    const val = parseFloat(document.getElementById('auft-roh-' + i)?.value) || 0;
                    rohWerte.push(val);
                    rohSumme += val;
                }

                document.getElementById('auft-roh-summe').innerText = rohSumme.toFixed(0) + ' g';

                // Netto-Kochgewicht ermitteln (Waage minus Topf-Tara)
                const topfTara = parseFloat(document.getElementById('auft-topf-auswahl').value) || 0;
                const waageBrutto = parseFloat(document.getElementById('auft-waage-gesamt').value) || 0;
                const nettoInfo = document.getElementById('auft-netto-info');

                let gekochtNetto = 0;
                if (waageBrutto > 0) {
                    gekochtNetto = waageBrutto - topfTara;
                    if (gekochtNetto <= 0) {
                        nettoInfo.innerHTML = '<span style="color: #dc3545; font-weight: bold;">⚠️ Waage ist kleiner als Topfgewicht!</span>';
                    } else {
                        const faktor = rohSumme > 0 ? (gekochtNetto / rohSumme).toFixed(2) : '0';
                        nettoInfo.innerHTML = `Gekocht Netto: <strong>${gekochtNetto.toFixed(0)} g</strong> (Quellfaktor: ${faktor}x)`;
                    }
                } else {
                    nettoInfo.innerText = 'Bitte nach dem Kochen das Gewicht auf der Waage eintragen.';
                }

                // Jede Portion proportional zum Rohgewicht berechnen
                for (let i = 0; i < anzahlPortionen; i++) {
                    const zielFeld = document.getElementById('auft-ergibt-' + i);
                    if (!zielFeld) continue;

                    if (rohSumme > 0 && gekochtNetto > 0 && rohWerte[i] > 0) {
                        const anteilGekocht = (rohWerte[i] / rohSumme) * gekochtNetto;
                        zielFeld.innerText = anteilGekocht.toFixed(1).replace('.', ',') + ' g';
                    } else {
                        zielFeld.innerText = '0,0 g';
                    }
                }
            };

            // Beim Start initialisieren
            auftTopfDropdownAktualisieren();
            auftTabelleBauen();
        });
    </script>

    <!-- BAUSTEIN 16: RÜCKWÄRTS-RECHNER (Direkt-Klapp-Version) -->
    <script>
        (function() {
            const ergebnisBox = document.getElementById('rez-100g-ergebnis');
            if (!ergebnisBox) return;

            const box = document.createElement('div');
            box.style.cssText = 'background: #f0f7ff; border: 1px solid #bae0ff; border-radius: 6px; padding: 8px 10px; margin-bottom: 12px;';
            box.innerHTML = `
                <button type="button" onclick="const el = document.getElementById('rez-rw-inhalt'); el.style.display = (el.style.display === 'none' ? 'block' : 'none'); rezRwListeFuellen();" 
                        style="width: 100%; background: none; border: none; text-align: left; font-weight: bold; font-size: 13px; color: #0056b3; cursor: pointer; padding: 0;">
                    🔄 Rückwärts-Rechner: Wie viel Gramm für Ziel-Nährwert? ▼
                </button>
                <div id="rez-rw-inhalt" style="display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #91caff; font-size: 13px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 4px;">Welcher Nährwert soll erreicht werden?</label>
                    <select id="rez-rw-naehrstoff" onchange="rezRwRechnen()" style="margin-bottom: 6px; padding: 6px; font-size: 14px;"></select>
                    <label style="font-weight: bold; display: block; margin-bottom: 4px;">Gewünschte Ziel-Menge (z.B. 60 für 60g KH):</label>
                    <input type="number" id="rez-rw-zielwert" placeholder="Zielwert eingeben..." onkeyup="rezRwRechnen()" onchange="rezRwRechnen()" style="margin-bottom: 8px; padding: 6px; font-size: 14px;">
                    <div id="rez-rw-ergebnis" style="background: white; padding: 8px; border-radius: 6px; border: 1px solid #d9d9d9; font-weight: bold; color: #333;">
                        Bitte oben Zutaten einfügen und hier Zielwert eintippen.
                    </div>
                </div>
            `;
            ergebnisBox.parentElement.insertBefore(box, ergebnisBox.nextSibling);

            window.rezRwListeFuellen = function() {
                const select = document.getElementById('rez-rw-naehrstoff');
                if (select.options.length === 0 && AppDaten.naehrstoffSpalten) {
                    select.innerHTML = AppDaten.naehrstoffSpalten.map(s => `<option value="${s}">${s}</option>`).join('');
                }
                rezRwRechnen();
            };

            window.rezRwRechnen = function() {
                const ausgabe = document.getElementById('rez-rw-ergebnis');
                const spalte = document.getElementById('rez-rw-naehrstoff').value;
                const ziel = parseFloat(document.getElementById('rez-rw-zielwert').value);
                if (!spalte || !ziel || ziel <= 0) { ausgabe.innerHTML = 'Bitte Nährwert wählen und Ziel-Menge eintippen.'; return; }

                const zeilen = document.querySelectorAll('#rez-zutaten-liste > div');
                if (zeilen.length === 0) { ausgabe.innerHTML = '<span style="color: #dc3545;">⚠️ Bitte oben zuerst Zutaten in den Topf geben!</span>'; return; }

                let roh = 0, gesamtWert = 0;
                zeilen.forEach(z => {
                    const name = z.querySelector('span')?.innerText.trim();
                    const gramm = parseFloat(z.querySelector('input')?.value) || 0;
                    roh += gramm;
                    const lm = AppDaten.lebensmittel.find(l => l.name === name);
                    if (lm && lm.werte[spalte]) gesamtWert += (lm.werte[spalte] * gramm) / 100;
                });

                const tara = parseFloat(document.getElementById('rez-topf-auswahl').value) || 0;
                const waage = parseFloat(document.getElementById('rez-gesamt-waage').value) || 0;
                const netto = waage > 0 ? (waage - tara) : roh;

                if (netto <= 0 || gesamtWert <= 0) { ausgabe.innerHTML = `<span style="color: #dc3545;">⚠️ Rezept enthält 0 von "${spalte}".</span>`; return; }

                const pro100 = (gesamtWert / netto) * 100;
                const portion = (ziel / pro100) * 100;

                ausgabe.innerHTML = `
                    <div style="color: #198754; font-size: 15px; margin-bottom: 6px;">➔ Du brauchst: <strong>${portion.toFixed(0)} g</strong> fertige Speise</div>
                    <div style="font-size: 12px; font-weight: normal; color: #555; margin-bottom: 6px;">(Basis: ${pro100.toFixed(1)} pro 100g)</div>
                    <button type="button" onclick="document.getElementById('rez-portion-gramm').value = ${portion.toFixed(0)}" 
                            style="width: 100%; padding: 6px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
                        ⬇️ Diese ${portion.toFixed(0)}g als Portion übernehmen
                    </button>`;
            };
        })();
    </script>

    <script>
        (function() {

    <!-- BAUSTEIN 17-2: KOCHBUCH FILTER & KARTEN -->
    <script>
        window.kbZeichnen = function() {
            const rezepte = AppDaten.rezepte || [];
            const anzahlEl = document.getElementById('kb-anzahl');
            if (!anzahlEl) return;
            anzahlEl.innerText = rezepte.length;

            const alleTagsSet = new Set();
            rezepte.forEach(r => (r.kategorien || []).forEach(tag => alleTagsSet.add(tag)));

            const tagLeiste = document.getElementById('kb-tag-leiste');
            const tagsArray = ['ALLE', ...Array.from(alleTagsSet).sort()];
            tagLeiste.innerHTML = tagsArray.map(tag => {
                const aktiv = (window.kbAktiverTag === tag);
                return `<button type="button" onclick="kbTagSetzen('${tag}')" style="padding: 4px 10px; border: 1px solid #f59e0b; border-radius: 14px; background: ${aktiv ? '#d97706' : '#fef3c7'}; color: ${aktiv ? 'white' : '#92400e'}; font-size: 12px; font-weight: bold; cursor: pointer;">${tag === 'ALLE' ? 'Alle' : tag}</button>`;
            }).join('');

            const suche = (document.getElementById('kb-suche').value || '').toLowerCase();
            const gefiltert = rezepte.filter(r => {
                const tagPasst = (window.kbAktiverTag === 'ALLE') || (r.kategorien && r.kategorien.includes(window.kbAktiverTag));
                const textPasst = r.name.toLowerCase().includes(suche) || (r.beschreibung || '').toLowerCase().includes(suche) || (r.zutaten || []).some(z => z.name.toLowerCase().includes(suche));
                return tagPasst && textPasst;
            });

            const liste = document.getElementById('kb-liste');
            if (gefiltert.length === 0) {
                liste.innerHTML = '<div style="font-size: 13px; color: #777; padding: 8px 0;">Keine passenden Rezepte gefunden.</div>';
                return;
            }

            const finde = (woerter) => AppDaten.naehrstoffSpalten.find(s => woerter.some(w => s.toLowerCase().includes(w)));
            const spKcal = finde(['kcal', 'kalorien', 'energie']), spProt = finde(['protein', 'eiweiß', 'eiweiss']), spKh = finde(['kohlenhydrat', 'kh']), spFett = finde(['fett']);

            liste.innerHTML = gefiltert.map(r => {
                let roh = 0, sK = 0, sP = 0, sC = 0, sF = 0;
                (r.zutaten || []).forEach(z => {
                    roh += (z.gramm || 0);
                    const f = (z.gramm || 0) / 100;
                    if (spKcal) sK += (z.wertePro100g[spKcal] || 0) * f;
                    if (spProt) sP += (z.wertePro100g[spProt] || 0) * f;
                    if (spKh)   sC += (z.wertePro100g[spKh] || 0) * f;
                    if (spFett) sF += (z.wertePro100g[spFett] || 0) * f;
                });
                const f100 = roh > 0 ? (100 / roh) : 0;
                const info = roh > 0 ? `${(sK * f100).toFixed(0)} kcal | P: ${(sP * f100).toFixed(1)}g | KH: ${(sC * f100).toFixed(1)}g | F: ${(sF * f100).toFixed(1)}g` : '';
                const tags = (r.kategorien || []).map(t => `<span style="background: #fde68a; color: #78350f; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 4px;">${t}</span>`).join('');
                const beschr = r.beschreibung ? `<div style="font-size: 12px; color: #444; margin-top: 6px; white-space: pre-line; background: #fafbfc; padding: 6px; border-radius: 4px;">${r.beschreibung}</div>` : '';

                return `<div style="background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin-bottom: 8px;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
                        <div><strong style="font-size: 15px;">${r.name}</strong><div style="margin-top: 3px;">${tags}</div></div>
                        <button type="button" onclick="kbRezeptKochen(${r.id})" style="background: #198754; color: white; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer;">🍳 Kochen</button>
                    </div>
                    <div style="font-size: 12px; font-weight: bold; color: #0056b3; margin-top: 6px;">📊 ca. pro 100g: ${info}</div>
                    <div style="font-size: 11px; color: #666; margin-top: 3px;">Zutaten: ${(r.zutaten || []).map(z => z.name).join(', ')}</div>
                    ${beschr}
                </div>`;
            }).join('');
        };
    </script>
    <!-- BAUSTEIN 17-3: KOCHBUCH SPEICHERN & LADEN -->

    <script>
        (function() {
            const lmModul = document.getElementById('modul-lebensmittel');
            const backupModul = document.getElementById('modul-backup');
            if (!lmModul || !backupModul) return;

            // 1. Tab-Leiste aufräumen: "Backup"-Button ausblenden & ersten Tab umbenennen
            const navButtons = document.querySelectorAll('nav button');
            navButtons.forEach(btn => {
                if (btn.innerText.includes('Lebensmittel')) btn.innerText = '🍎 Lebensmittel & Daten';
                if (btn.innerText.includes('Backup')) btn.style.display = 'none';
            });

            // 2. Bestehende Elemente aus Lebensmittel- & Backup-Tab einsammeln
            const neuFormular = document.getElementById('lm-neu-formular');
            const csvInput = document.getElementById('csv-datei');
            const csvStatus = document.getElementById('csv-status');
            const backupInput = document.getElementById('backup-datei');
            const lmSuche = document.getElementById('lm-suche');
            const lmListe = document.getElementById('lm-liste');

            // 3. Drei neutrale, weiße Klapp-Karten bauen
            const werkzeugeWrapper = document.createElement('div');
            werkzeugeWrapper.style.marginBottom = '20px';

            // Hilfsfunktion zum Erstellen einer neutralen Klapp-Karte
            function baueKlappKarte(id, titel, onOpenFn) {
                const karte = document.createElement('div');
                karte.className = 'klapp-karte';
                karte.innerHTML = `
                    <button type="button" class="klapp-kopf" id="btn-${id}">
                        <span>${titel}</span>
                        <span style="font-size: 12px; color: #64748b;">▼ Öffnen</span>
                    </button>
                    <div class="klapp-inhalt" id="box-${id}"></div>
                `;
                karte.querySelector('button').onclick = function() {
                    const box = document.getElementById('box-' + id);
                    const istZu = (box.style.display === 'none' || box.style.display === '');
                    box.style.display = istZu ? 'block' : 'none';
                    this.querySelector('span:last-child').innerText = istZu ? '▲ Schließen' : '▼ Öffnen';
                    if (istZu && onOpenFn) onOpenFn();
                };
                return karte;
            }

            // Karte 1: Neues Lebensmittel anlegen
            const karteNeu = baueKlappKarte('klapp-lm-neu', '➕ Neues Lebensmittel anlegen', () => {
                if (neuFormular && neuFormular.style.display === 'none' && window.lmNeuFormularOeffnen) {
                    lmNeuFormularOeffnen();
                }
            });
            if (neuFormular) {
                neuFormular.style.borderTop = 'none';
                neuFormular.style.marginTop = '0';
                neuFormular.style.paddingTop = '0';
                karteNeu.querySelector('#box-klapp-lm-neu').appendChild(neuFormular);
            }

            // Karte 2: Excel-CSV Import & Export
            const karteCsv = baueKlappKarte('klapp-csv', '📄 Excel-CSV Import & Export (41 Spalten)');
            const csvBox = karteCsv.querySelector('#box-klapp-csv');
            csvBox.innerHTML = `<p style="font-size: 13px; color: #475569; margin-top: 0;">CSV (Trennzeichen-getrennt) auswählen. Spalte 1 = Name, alle weiteren = Nährwerte.</p>`;
            if (csvInput) csvBox.appendChild(csvInput);
            const btnCsvIn = document.createElement('button');
            btnCsvIn.className = 'action';
            btnCsvIn.innerText = '📥 CSV-Datei einlesen';
            btnCsvIn.onclick = () => window.csvImportieren && csvImportieren();
            csvBox.appendChild(btnCsvIn);
            if (csvStatus) csvBox.appendChild(csvStatus);

            const btnCsvOut = document.createElement('button');
            btnCsvOut.type = 'button';
            btnCsvOut.innerText = '📤 Lebensmittel-Liste als Excel-CSV speichern';
            btnCsvOut.style.cssText = 'width: 100%; padding: 10px; background: #475569; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;';
            btnCsvOut.onclick = () => {
                // Nutzt den bestehenden Export-Button aus Baustein 12
                const alterExport = Array.from(lmModul.querySelectorAll('button')).find(b => b.innerText.includes('Excel-CSV herunterladen'));
                if (alterExport) alterExport.click();
            };
            csvBox.appendChild(btnCsvOut);

            // Karte 3: Datensicherung (Backup)
            const karteBackup = baueKlappKarte('klapp-backup', '💾 Datensicherung (JSON-Backup)');
            const bkpBox = karteBackup.querySelector('#box-klapp-backup');
            bkpBox.innerHTML = `
                <p style="font-size: 13px; color: #475569; margin-top: 0;">Sichere deinen kompletten Stand (Lebensmittel, Töpfe, Rezepte, Tagespläne & Gewicht) als Datei oder spiele ein Backup ein.</p>
                <button type="button" class="action" onclick="exportiereBackup()">⬇️ Backup herunterladen</button>
                <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 12px 0;">
            `;
            if (backupInput) bkpBox.appendChild(backupInput);
            const btnBkpLoad = document.createElement('button');
            btnBkpLoad.type = 'button';
            btnBkpLoad.innerText = '⬆️ Backup-Datei laden';
            btnBkpLoad.style.cssText = 'width: 100%; padding: 10px; background: #475569; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;';
            btnBkpLoad.onclick = () => window.importiereBackup && importiereBackup();
            bkpBox.appendChild(btnBkpLoad);

            werkzeugeWrapper.appendChild(karteNeu);
            werkzeugeWrapper.appendChild(karteCsv);
            werkzeugeWrapper.appendChild(karteBackup);

            // 4. Lebensmittel-Modul sauber neu aufbauen (oben die 3 Klapp-Karten, darunter direkt Suche & Liste)
            const anzahlText = document.getElementById('lm-anzahl') ? document.getElementById('lm-anzahl').innerText : '0';

            lmModul.appendChild(werkzeugeWrapper);

            const listeHeader = document.createElement('h2');

            listeHeader.innerHTML = `Deine Lebensmittel (<span id="lm-anzahl">${anzahlText}</span>)`;
            lmModul.appendChild(listeHeader);
            if (lmSuche) lmModul.appendChild(lmSuche);
            if (lmListe) lmModul.appendChild(lmListe);

    <!-- ===================================================================== -->
    <script>
        (function() {
            // Hilfsfunktion: Baut eine einheitliche weiße Klapp-Karte im Stil von Baustein 19
            function erstelleKlappSektion(id, titelHTML, geoeffnetStart) {
                const karte = document.createElement('div');
                karte.className = 'klapp-karte';
                karte.innerHTML = `
                    <button type="button" class="klapp-kopf" id="btn-${id}">
                        <span>${titelHTML}</span>
                        <span style="font-size: 12px; color: #64748b;">${geoeffnetStart ? '▲ Schließen' : '▼ Öffnen'}</span>
                    </button>
                    <div class="klapp-inhalt" id="box-${id}" style="display: ${geoeffnetStart ? 'block' : 'none'};"></div>
                `;
                karte.querySelector('button').onclick = function() {
                    const box = document.getElementById('box-' + id);
                    const istZu = (box.style.display === 'none' || box.style.display === '');
                    box.style.display = istZu ? 'block' : 'none';
                    this.querySelector('span:last-child').innerText = istZu ? '▲ Schließen' : '▼ Öffnen';
                };
                return karte;
            }

            // 1. LEBENSMITTELLISTE IM TAB "LEBENSMITTEL & DATEN" EINKLAPPEN
            const lmModul = document.getElementById('modul-lebensmittel');
            const lmSuche = document.getElementById('lm-suche');
            const lmListe = document.getElementById('lm-liste');
            const lmAnzahlSpan = document.getElementById('lm-anzahl');

            if (lmModul && lmSuche && lmListe && lmAnzahlSpan) {
                const alterHeader = lmAnzahlSpan.closest('h2');
                const anzahlStart = lmAnzahlSpan.innerText;
                if (alterHeader) alterHeader.remove();

                // Neue Klapp-Karte erstellen (startet eingeklappt)
                const lmKlapp = erstelleKlappSektion('klapp-lm-liste', `🍎 Deine Lebensmittel (<span id="lm-anzahl">${anzahlStart}</span>)`, false);
                const lmInhalt = lmKlapp.querySelector('#box-klapp-lm-liste');

                lmInhalt.appendChild(lmSuche);
                lmInhalt.appendChild(lmListe);
                lmModul.appendChild(lmKlapp);
            }

            // 2. TOPFLISTE IM TAB "TÖPFE" EINKLAPPEN
            const topfModul = document.getElementById('modul-toepfe');
            const topfListe = document.getElementById('topf-liste');
            const topfAnzahlSpan = document.getElementById('topf-anzahl');

            if (topfModul && topfListe && topfAnzahlSpan) {
                const alterTopfHeader = topfAnzahlSpan.closest('h3');
                const topfStartAnzahl = topfAnzahlSpan.innerText;
                if (alterTopfHeader) alterTopfHeader.remove();

                // Neue Klapp-Karte erstellen (startet eingeklappt)
                const topfKlapp = erstelleKlappSektion('klapp-topf-liste', `🍳 Gespeicherte Töpfe & Gefäße (<span id="topf-anzahl">${topfStartAnzahl}</span>)`, false);
                const topfInhalt = topfKlapp.querySelector('#box-klapp-topf-liste');

                topfInhalt.appendChild(topfListe);
                topfModul.appendChild(topfKlapp);
            }
        })();

    <script>
        (function() {

            if (!datumFeld) return;

            // 1. Festen Standard auf deine Wunschwerte (1600 kcal & 35/35/30) setzen
            if (!AppDaten.kcalZiele) AppDaten.kcalZiele = { standard: 1600, proTag: {} };
            AppDaten.kcalZiele.standard = 1600;

            if (!AppDaten.makroZiele) AppDaten.makroZiele = { standard: { kh: 35, prot: 35, fett: 30 }, proTag: {} };
            AppDaten.makroZiele.standard = { kh: 35, prot: 35, fett: 30 };
            speichereDaten();

            // 2. Kalorien-Speichern überschreiben: Ändert NUR den gewählten Tag, nicht den Standard!
            window.tpZielSpeichern = function() {
                const wert = parseFloat(document.getElementById('tp-kcal-ziel').value);
                const datumStr = datumFeld.value;
                if (!isNaN(wert) && wert >= 0) {
                    if (!AppDaten.kcalZiele.proTag) AppDaten.kcalZiele.proTag = {};
                    AppDaten.kcalZiele.proTag[datumStr] = wert;
                    // AppDaten.kcalZiele.standard bleibt fest auf 1600!
                    speichereDaten();
                    if (window.tpAmpelAktualisieren) tpAmpelAktualisieren();
                    if (window.tpMakroZieleAktualisieren) tpMakroZieleAktualisieren();
                }
            };

            // 3. Makro-Prozente überschreiben: Ändert ebenfalls NUR den gewählten Tag!
            window.tpMakroSpeichern = function() {
                const datumStr = datumFeld.value;
                const kh = parseFloat(document.getElementById('tp-proz-kh').value) || 0;
                const prot = parseFloat(document.getElementById('tp-proz-prot').value) || 0;
                const fett = parseFloat(document.getElementById('tp-proz-fett').value) || 0;

                if (!AppDaten.makroZiele.proTag) AppDaten.makroZiele.proTag = {};
                AppDaten.makroZiele.proTag[datumStr] = { kh: kh, prot: prot, fett: fett };
                // AppDaten.makroZiele.standard bleibt fest auf 35/35/30!
                speichereDaten();
                if (window.tpMakroZieleAktualisieren) tpMakroZieleAktualisieren();
            };

            // Direkt einmal neu zeichnen, damit Montag sofort wieder auf 1600 kcal springt
            if (window.tpZeichnen) tpZeichnen();
        })();
    </script>

    <!-- ===================================================================== -->
    <script>
        (function() {
            // Funktion zum Löschen eines Rezepts direkt aus der Kochbuch-Karte
            window.kbRezeptLoeschen = function(rezId) {
                const rez = AppDaten.rezepte.find(r => r.id === rezId);
                if (!rez) return;
                if (!confirm(`Möchtest du das Rezept "${rez.name}" wirklich dauerhaft löschen?`)) return;

                AppDaten.rezepte = AppDaten.rezepte.filter(r => r.id !== rezId);
                speichereDaten();

                // Falls das gelöschte Rezept gerade unten geladen war, Felder leeren
                const auswahl = document.getElementById('rez-auswahl');
                if (auswahl && parseFloat(auswahl.value) === rezId) {
                    auswahl.value = '';
                    if (window.rezVorlageLaden) rezVorlageLaden();
                }

                if (window.rezVorlagenDropdownFuellen) rezVorlagenDropdownFuellen();
                if (window.kbZeichnen) kbZeichnen();
            };

            // Funktion zum Bearbeiten: Lädt das Rezept nach unten & markiert den Speichern-Button
            window.kbRezeptBearbeiten = function(rezId) {
                if (window.kbRezeptKochen) {
                    kbRezeptKochen(rezId);
                    const nameFeld = document.getElementById('rez-name');
                    if (nameFeld) {
                        nameFeld.focus();
                        nameFeld.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            };

            // Erweitert die bestehende Kochbuch-Anzeige (kbZeichnen) um die Buttons "✏️ Bearbeiten" & "🗑️"
            const basisKbZeichnen = window.kbZeichnen;
            if (basisKbZeichnen) {
                window.kbZeichnen = function() {
                    basisKbZeichnen();

                    const karten = document.querySelectorAll('#kb-liste > div');
                    karten.forEach(karte => {
                        const kochenBtn = karte.querySelector('button[onclick^="kbRezeptKochen"]');
                        if (!kochenBtn || karte.querySelector('.kb-edit-gruppe')) return;

                        // Rezept-ID sauber aus dem bestehenden Kochen-Button auslesen
                        const onclickText = kochenBtn.getAttribute('onclick') || '';
                        const start = onclickText.indexOf('(');
                        const ende = onclickText.indexOf(')');
                        if (start === -1 || ende <= start) return;
                        const rezId = onclickText.slice(start + 1, ende);

                        // Button-Gruppe für Kochen, Bearbeiten & Löschen bauen
                        const gruppe = document.createElement('div');
                        gruppe.className = 'kb-edit-gruppe';
                        gruppe.style.cssText = 'display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end;';

                        const editBtn = document.createElement('button');
                        editBtn.type = 'button';
                        editBtn.innerText = '✏️ Bearbeiten';
                        editBtn.style.cssText = 'background: #475569; color: white; border: none; border-radius: 6px; padding: 6px 9px; font-size: 12px; font-weight: bold; cursor: pointer;';
                        editBtn.setAttribute('onclick', `kbRezeptBearbeiten(${rezId})`);

                        const delBtn = document.createElement('button');
                        delBtn.type = 'button';
                        delBtn.innerText = '🗑️';
                        delBtn.title = 'Rezept löschen';
                        delBtn.style.cssText = 'background: #dc3545; color: white; border: none; border-radius: 6px; padding: 6px 8px; font-size: 12px; font-weight: bold; cursor: pointer;';
                        delBtn.setAttribute('onclick', `kbRezeptLoeschen(${rezId})`);

                        kochenBtn.parentNode.insertBefore(gruppe, kochenBtn);
                        gruppe.appendChild(kochenBtn);
                        gruppe.appendChild(editBtn);
                        gruppe.appendChild(delBtn);
                    });
                };

                // Direkt einmal ausführen, damit die Buttons sofort sichtbar sind
                kbZeichnen();
            }
        })();
    </script>

    <!-- BAUSTEIN 26: MAHLZEITEN-NÄHRWERTE IN KLAMMERN (kcal, KH, P, F)        -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            const datumFeld = document.getElementById('tp-datum');
            if (!datumFeld || !window.tpZeichnen) return;

            // Hilfsfunktion: Findet die passende Spalte unabhängig von der genauen Schreibweise
            function findeSpalte(suchwoerter) {
                return (AppDaten.naehrstoffSpalten || []).find(spalte =>
                    suchwoerter.some(wort => spalte.toLowerCase().includes(wort))
                );
            }

            // Berechnet und ergänzt die Makros direkt neben jeder Mahlzeiten-Überschrift
            window.tpMahlzeitenMakrosAnzeigen = function() {
                const datum = datumFeld.value;
                const eintraege = (AppDaten.tagesplan && AppDaten.tagesplan[datum]) ? AppDaten.tagesplan[datum] : [];

                const spKcal = findeSpalte(['kcal', 'kalorien', 'energie']);
                const spKh   = findeSpalte(['kohlenhydrat', 'kh']);
                const spProt = findeSpalte(['protein', 'eiweiß', 'eiweiss']);
                const spFett = findeSpalte(['fett']);

                const karten = document.querySelectorAll('#tp-mahlzeiten-liste > div');
                karten.forEach(karte => {
                    // Sucht die Mahlzeiten-Überschrift (Frühstück, Mittagessen, Abendessen, Snack)
                    const titelEl = karte.querySelector('strong');
                    if (!titelEl) return;

                    // Bereits vorhandene Info-Klammer entfernen, damit beim Neuzeichnen nichts doppelt steht
                    const alteInfo = karte.querySelector('.mz-makro-klammer');
                    if (alteInfo) alteInfo.remove();

                    const mzName = titelEl.innerText.trim();
                    const mzEintraege = eintraege.filter(e => e.mahlzeit === mzName);

                    // Wenn in dieser Mahlzeit noch nichts eingetragen ist, keine Klammer anzeigen
                    if (mzEintraege.length === 0) return;

                    let sumKcal = 0, sumKh = 0, sumProt = 0, sumFett = 0;
                    mzEintraege.forEach(e => {
                        const faktor = (e.gramm || 0) / 100;
                        if (spKcal) sumKcal += (e.wertePro100g[spKcal] || 0) * faktor;
                        if (spKh)   sumKh   += (e.wertePro100g[spKh]   || 0) * faktor;
                        if (spProt) sumProt += (e.wertePro100g[spProt] || 0) * faktor;
                        if (spFett) sumFett += (e.wertePro100g[spFett] || 0) * faktor;
                    });

                    // Kompakte Klammer bauen und direkt neben den Mahlzeiten-Namen setzen
                    const infoSpan = document.createElement('span');
                    infoSpan.className = 'mz-makro-klammer';
                    infoSpan.style.cssText = 'font-size: 12px; font-weight: normal; color: #475569; margin-left: 6px;';
                    infoSpan.innerText = `(${sumKcal.toFixed(0)} kcal | KH: ${sumKh.toFixed(1)}g | P: ${sumProt.toFixed(1)}g | F: ${sumFett.toFixed(1)}g)`;

                    titelEl.parentNode.insertBefore(infoSpan, titelEl.nextSibling);
                });
            };

            // Sauber in die bestehende tpZeichnen-Funktion einklinken
            const vorherigesZeichnen = window.tpZeichnen;
            window.tpZeichnen = function() {
                vorherigesZeichnen();
                tpMahlzeitenMakrosAnzeigen();
            };

            // Direkt beim Laden einmal ausführen
            tpMahlzeitenMakrosAnzeigen();
        })();
    </script>

                    if (mzEintraege.length === 0) {

    <!-- ===================================================================== -->
    <script>
        (function() {
            const datumFeld = document.getElementById('tp-datum');
            if (!datumFeld) return;

            // 1. Deaktiviert die fehlerhafte Funktion aus Baustein 27, damit kein Eintrag mehr überschrieben wird
            window.tpMahlzeitenBadgeErweitern = function() {};

            function findeSpalte(suchwoerter) {
                return (AppDaten.naehrstoffSpalten || []).find(spalte =>
                    suchwoerter.some(wort => spalte.toLowerCase().includes(wort))
                );
            }

            // 2. Fügt die Mahlzeiten-Nährwerte als eigene, geschützte Info-Zeile direkt unter "Mittagessen" etc. ein
            window.tpMahlzeitenSummeSauber = function() {
                const datum = datumFeld.value;
                const eintraege = (AppDaten.tagesplan && AppDaten.tagesplan[datum]) ? AppDaten.tagesplan[datum] : [];

                const spKcal = findeSpalte(['kcal', 'kalorien', 'energie']);
                const spKh   = findeSpalte(['kohlenhydrat', 'kh']);
                const spProt = findeSpalte(['protein', 'eiweiß', 'eiweiss']);
                const spFett = findeSpalte(['fett']);

                const karten = document.querySelectorAll('#tp-mahlzeiten-liste > div');
                karten.forEach(karte => {
                    // Bestehende Summe zuerst entfernen, damit beim Neuzeichnen nichts doppelt steht
                    const alteZeile = karte.querySelector('.mz-makro-summe-zeile');
                    if (alteZeile) alteZeile.remove();

                    // Überschrift direkt in der Karte finden (z.B. "Mittagessen")
                    const titelEl = karte.querySelector(':scope > strong');
                    if (!titelEl) return;

                    const mzName = titelEl.innerText.trim();
                    const mzEintraege = eintraege.filter(e => e.mahlzeit === mzName);
                    if (mzEintraege.length === 0) return;

                    let sumKcal = 0, sumKh = 0, sumProt = 0, sumFett = 0;
                    mzEintraege.forEach(e => {
                        const faktor = (e.gramm || 0) / 100;
                        if (spKcal) sumKcal += (e.wertePro100g[spKcal] || 0) * faktor;
                        if (spKh)   sumKh   += (e.wertePro100g[spKh]   || 0) * faktor;
                        if (spProt) sumProt += (e.wertePro100g[spProt] || 0) * faktor;
                        if (spFett) sumFett += (e.wertePro100g[spFett] || 0) * faktor;
                    });

                    // Eigene grüne Info-Zeile direkt nach der Überschrift einfügen (berührt keine Lebensmittel!)
                    const infoBox = document.createElement('div');
                    infoBox.className = 'mz-makro-summe-zeile';
                    infoBox.style.cssText = 'display: inline-block; margin: 4px 0 8px 0; padding: 3px 10px; background: #eef5f2; color: #2e6f56; border: 1px solid #bfd8ce; border-radius: 12px; font-size: 12px; font-weight: bold;';
                    infoBox.innerText = `${sumKcal.toFixed(0)} kcal | KH: ${sumKh.toFixed(1)}g | P: ${sumProt.toFixed(1)}g | F: ${sumFett.toFixed(1)}g`;

                    // Nach dem Titel einen kleinen Zeilenumbruch-Wrapper setzen, damit die Einträge sauber darunter starten
                    titelEl.style.display = 'block';
                    karte.insertBefore(infoBox, titelEl.nextSibling);
                });
            };

            // Sauber an tpZeichnen anhängen und einmal komplett neu zeichnen, um die Kartoffel-Gemüse-Pfanne sofort wiederherzustellen
            const vorherigesZeichnen = window.tpZeichnen;
            window.tpZeichnen = function() {
                vorherigesZeichnen();
                tpMahlzeitenSummeSauber();
            };

            tpZeichnen();
        })();

    <!-- BAUSTEIN 31A: LIVE-NÄHRWERTVORSCHAU BEIM AUSWÄHLEN IM TAGESPLAN       -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            const lmSelect = document.getElementById('tp-lm-auswahl');
            const grammInput = document.getElementById('tp-gramm');
            const filterInput = document.getElementById('tp-lm-filter');
            if (!lmSelect || !grammInput) return;

            // Vorschau-Box direkt unterhalb der Schnelleingabe-Zeile einfügen
            const eingabeKarte = lmSelect.closest('div[style*="border"]');
            const vorschauBox = document.createElement('div');
            vorschauBox.id = 'tp-lm-vorschau';
            vorschauBox.style.cssText = 'margin-top: 8px; padding: 6px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; color: #334155;';
            if (eingabeKarte) eingabeKarte.appendChild(vorschauBox);

            function findeSpalte(woerter) {
                return (AppDaten.naehrstoffSpalten || []).find(s =>
                    woerter.some(w => s.toLowerCase().includes(w))
                );
            }

            // Berechnet & zeigt die Nährwerte für das aktuell gewählte Lebensmittel an
            window.tpVorschauAktualisieren = function() {
                const lmId = parseFloat(lmSelect.value);
                const lm = (AppDaten.lebensmittel || []).find(item => item.id === lmId);
                if (!lm) {
                    vorschauBox.style.display = 'none';
                    return;
                }

                vorschauBox.style.display = 'block';
                const spKcal = findeSpalte(['kcal', 'kalorien', 'energie']);
                const spKh   = findeSpalte(['kohlenhydrat', 'kh']);
                const spProt = findeSpalte(['protein', 'eiweiß', 'eiweiss']);
                const spFett = findeSpalte(['fett']);

                const k100 = spKcal ? (lm.werte[spKcal] || 0) : 0;
                const c100 = spKh   ? (lm.werte[spKh]   || 0) : 0;
                const p100 = spProt ? (lm.werte[spProt] || 0) : 0;
                const f100 = spFett ? (lm.werte[spFett] || 0) : 0;

                const gramm = parseFloat(grammInput.value);
                let portionHTML = '';
                if (gramm && gramm > 0) {
                    const f = gramm / 100;
                    portionHTML = `<div style="margin-top: 4px; padding-top: 4px; border-top: 1px dashed #cbd5e1; color: #2e6f56; font-weight: bold;">
                        ➔ Deine Portion (${gramm}g): ${(k100 * f).toFixed(0)} kcal | KH: ${(c100 * f).toFixed(1)}g | P: ${(p100 * f).toFixed(1)}g | F: ${(f100 * f).toFixed(1)}g
                    </div>`;
                }

                vorschauBox.innerHTML = `
                    <div><strong>📊 Pro 100g (${lm.name}):</strong> ${k100.toFixed(0)} kcal | KH: ${c100.toFixed(1)}g | P: ${p100.toFixed(1)}g | F: ${f100.toFixed(1)}g</div>
                    ${portionHTML}
                `;
            };

            // Bei Wechsel im Dropdown, Tippen im Suchfeld oder Ändern der Grammzahl sofort aktualisieren
            lmSelect.addEventListener('change', tpVorschauAktualisieren);
            grammInput.addEventListener('input', tpVorschauAktualisieren);
            if (filterInput) filterInput.addEventListener('keyup', tpVorschauAktualisieren);

            const basisDropdown = window.tpDropdownFuellen;
            if (basisDropdown) {
                window.tpDropdownFuellen = function() {
                    basisDropdown();
                    tpVorschauAktualisieren();
                };
            }

            tpVorschauAktualisieren();
        })();
    </script>

    <!-- BAUSTEIN 31B: EINGETRAGENE MENGEN IM TAGESPLAN BEARBEITEN             -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            const datumFeld = document.getElementById('tp-datum');
            if (!datumFeld || !window.tpZeichnen) return;

            // Öffnet eine Abfrage für die neue Grammzahl und berechnet alle Nährwerte automatisch neu
            window.tpEintragBearbeiten = function(eintragId) {
                const datum = datumFeld.value;
                const eintraege = (AppDaten.tagesplan && AppDaten.tagesplan[datum]) ? AppDaten.tagesplan[datum] : [];
                const eintrag = eintraege.find(e => e.eintragId === eintragId);
                if (!eintrag) return;

                const eingabe = prompt(`Neue Menge in Gramm für "${eintrag.name}":`, eintrag.gramm);
                if (eingabe === null) return; // Nutzer hat Abbrechen gedrückt

                const neueGramm = parseFloat(String(eingabe).replace(',', '.'));
                if (!neueGramm || neueGramm <= 0) {
                    return alert('Bitte eine gültige Grammzahl größer als 0 eingeben!');
                }

                eintrag.gramm = neueGramm;
                speichereDaten();
                tpZeichnen();
            };

            // Ergänzt bei jedem eingetragenen Lebensmittel einen ruhigen Bearbeiten-Button (✏️) neben dem Löschen-Button
            window.tpEditButtonsAnhaengen = function() {
                const loeschButtons = document.querySelectorAll('#tp-mahlzeiten-liste button[onclick^="tpEintragLoeschen"]');
                loeschButtons.forEach(delBtn => {
                    const zeile = delBtn.parentElement;
                    if (!zeile || zeile.querySelector('.tp-edit-btn')) return;

                    // Eintrag-ID aus dem bestehenden Löschen-Button auslesen
                    const onclickText = delBtn.getAttribute('onclick') || '';
                    const start = onclickText.indexOf('(');
                    const ende = onclickText.indexOf(')');
                    if (start === -1 || ende <= start) return;
                    const eintragId = onclickText.slice(start + 1, ende);

                    // Button-Container rechts bauen
                    const btnGruppe = document.createElement('div');
                    btnGruppe.style.cssText = 'display: flex; gap: 5px; align-items: center;';

                    const editBtn = document.createElement('button');
                    editBtn.type = 'button';
                    editBtn.className = 'tp-edit-btn';
                    editBtn.innerText = '✏️';
                    editBtn.title = 'Menge in Gramm ändern';
                    editBtn.style.cssText = 'background: #475569; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer;';
                    editBtn.setAttribute('onclick', `tpEintragBearbeiten(${eintragId})`);

                    zeile.insertBefore(btnGruppe, delBtn);
                    btnGruppe.appendChild(editBtn);
                    btnGruppe.appendChild(delBtn);
                });
            };

            // Sauber an tpZeichnen anhängen und direkt einmal ausführen
            const vorherigesZeichnen = window.tpZeichnen;
            window.tpZeichnen = function() {
                vorherigesZeichnen();
                tpEditButtonsAnhaengen();
            };

            tpEditButtonsAnhaengen();
        })();
    </script>

    <!-- BAUSTEIN 32: LIVE-PORTIONSVORSCHAU IM REZEPT-RECHNER                  -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            const portionInput = document.getElementById('rez-portion-gramm');
            const ergebnis100gBox = document.getElementById('rez-100g-ergebnis');
            if (!portionInput || !ergebnis100gBox) return;

            // 1. Vorschau-Box direkt unter dem Eingabefeld "Deine Portion in Gramm" einfügen
            const vorschauBox = document.createElement('div');
            vorschauBox.id = 'rez-portion-vorschau';
            vorschauBox.style.cssText = 'display: none; background: #eef5f2; border: 1px solid #bfd8ce; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; font-size: 13px; color: #1e293b;';
            portionInput.parentElement.insertBefore(vorschauBox, portionInput.nextSibling);

            // 2. Berechnet live die Nährwerte für die eingetippte Portionsgröße
            window.rezPortionVorschauAktualisieren = function() {
                const gramm = parseFloat(portionInput.value);
                if (!gramm || gramm <= 0) {
                    vorschauBox.style.display = 'none';
                    return;
                }

                // Liest die aktuellen 100g-Werte direkt aus der bestehenden Rezept-Berechnung aus
                const zeilen = document.querySelectorAll('#rez-zutaten-liste > div');
                if (zeilen.length === 0) {
                    vorschauBox.style.display = 'none';
                    return;
                }

                let roh = 0;
                const summen = {};
                (AppDaten.naehrstoffSpalten || []).forEach(s => summen[s] = 0);

                zeilen.forEach(z => {
                    const name = z.querySelector('span')?.innerText.trim();
                    const g = parseFloat(z.querySelector('input')?.value) || 0;
                    roh += g;
                    const lm = (AppDaten.lebensmittel || []).find(l => l.name === name);
                    if (lm) {
                        const f = g / 100;
                        for (const [spalte, wert] of Object.entries(lm.werte)) {
                            summen[spalte] = (summen[spalte] || 0) + (wert * f);
                        }
                    }
                });

                const tara = parseFloat(document.getElementById('rez-topf-auswahl')?.value) || 0;
                const waage = parseFloat(document.getElementById('rez-gesamt-waage')?.value) || 0;
                const netto = waage > 0 ? (waage - tara) : roh;

                if (netto <= 0) {
                    vorschauBox.style.display = 'none';
                    return;
                }

                // Faktor für die gewünschte Portion berechnen
                const faktorPortion = gramm / netto;
                const finde = (woerter) => (AppDaten.naehrstoffSpalten || []).find(s => woerter.some(w => s.toLowerCase().includes(w)));
                const spKcal = finde(['kcal', 'kalorien', 'energie']);
                const spKh   = finde(['kohlenhydrat', 'kh']);
                const spProt = finde(['protein', 'eiweiß', 'eiweiss']);
                const spFett = finde(['fett']);

                const k = spKcal ? (summen[spKcal] * faktorPortion).toFixed(0) : null;
                const c = spKh   ? (summen[spKh]   * faktorPortion).toFixed(1) : null;
                const p = spProt ? (summen[spProt] * faktorPortion).toFixed(1) : null;
                const f = spFett ? (summen[spFett] * faktorPortion).toFixed(1) : null;

                vorschauBox.style.display = 'block';
                vorschauBox.innerHTML = `
                    <strong style="color: #2e6f56;">📊 Vorberechnung für ${gramm}g Portion:</strong><br>
                    ${k !== null ? `<strong>${k}</strong> kcal | ` : ''}
                    ${c !== null ? `KH: <strong>${c}g</strong> | ` : ''}
                    ${p !== null ? `P: <strong>${p}g</strong> | ` : ''}
                    ${f !== null ? `F: <strong>${f}g</strong>` : ''}
                `;
            };

            // 3. Bei Eingabe der Grammzahl, bei Rezept-Neuberechnung und nach Übernahme aktualisieren
            portionInput.addEventListener('input', rezPortionVorschauAktualisieren);
            portionInput.addEventListener('change', rezPortionVorschauAktualisieren);

            const basisRezBerechnen = window.rezBerechnen;
            if (basisRezBerechnen) {
                window.rezBerechnen = function() {
                    basisRezBerechnen();
                    rezPortionVorschauAktualisieren();
                };
            }

            const basisPortionEintragen = window.rezPortionInTagesplan;
            if (basisPortionEintragen) {
                window.rezPortionInTagesplan = function() {
                    basisPortionEintragen();
                    rezPortionVorschauAktualisieren();
                };
            }

            // Auch wenn im Rückwärts-Rechner auf "Als Portion übernehmen" geklickt wird, sofort Vorschau zeigen
            document.addEventListener('click', function(e) {
                if (e.target && e.target.innerText && e.target.innerText.includes('als Portion übernehmen')) {
                    setTimeout(rezPortionVorschauAktualisieren, 20);
                }
            });
        })();
    </script>


    <!-- ===================================================================== -->
    <!-- BAUSTEIN 33: PORTIONEN-TEILER IM REZEPT-RECHNER (Menge / X Portionen) -->

    <script>

                const anzahl = parseFloat(document.getElementById('rez-teiler-anzahl').value);

                    ausgabe.innerHTML = '<span style="color: #dc3545;">⚠️ Bitte oben zuerst Zutaten in den Topf geben!</span>';
                    return;

                let roh = 0;

                        for (const [spalte, wert] of Object.entries(lm.werte)) {

                    ausgabe.innerHTML = '<span style="color: #dc3545;">⚠️ Waagen-Gewicht ist kleiner als das Topfgewicht!</span>';
                    return;
                }

                // Gewicht & Nährwerte pro Portion berechnen
                const grammProPortion = netto / anzahl;
                const finde = (woerter) => (AppDaten.naehrstoffSpalten || []).find(s => woerter.some(w => s.toLowerCase().includes(w)));
                const spKcal = finde(['kcal', 'kalorien', 'energie']);
                const spKh   = finde(['kohlenhydrat', 'kh']);

                const f = spFett ? (summen[spFett] / anzahl).toFixed(1) : null;

    <!-- BAUSTEIN 35B-1: KÜHLSCHRANK-TÖPFE (Speichern & Schöpfen)              -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            if (!document.getElementById('ks-liste')) return;

            // Speichert den aktuellen Topf + Zutaten + Waagengewicht dauerhaft im Kühlschrank
            window.ksTopfMerken = function() {
                const zeilen = document.querySelectorAll('#rez-zutaten-liste > div');
                if (zeilen.length === 0) return alert('Bitte füge zuerst Zutaten in den Topf ein!');

                let roh = 0;
                const summen = {};
                (AppDaten.naehrstoffSpalten || []).forEach(s => summen[s] = 0);

                zeilen.forEach(z => {
                    const name = z.querySelector('span')?.innerText.trim();
                    const g = parseFloat(z.querySelector('input')?.value) || 0;
                    roh += g;
                    const lm = (AppDaten.lebensmittel || []).find(l => l.name === name);
                    if (lm) {
                        const f = g / 100;
                        for (const [spalte, wert] of Object.entries(lm.werte)) {
                            summen[spalte] = (summen[spalte] || 0) + (wert * f);
                        }
                    }
                });

                const topfSelect = document.getElementById('rez-topf-auswahl');
                const topfTara = parseFloat(topfSelect?.value) || 0;
                const topfText = topfSelect && topfTara > 0 ? topfSelect.options[topfSelect.selectedIndex].text : 'Ohne Topf';
                const waageBrutto = parseFloat(document.getElementById('rez-gesamt-waage')?.value) || 0;

                const nettoStart = waageBrutto > 0 ? (waageBrutto - topfTara) : roh;
                if (nettoStart <= 0) return alert('Das Waagen-Gewicht ist kleiner als das Topfgewicht!');

                const wertePro100g = {};
                const faktor100g = 100 / nettoStart;
                for (const [spalte, gesamtWert] of Object.entries(summen)) {
                    wertePro100g[spalte] = gesamtWert * faktor100g;
                }

                const rezeptName = document.getElementById('rez-name')?.value.trim() || 'Selbstgekochtes Gericht';
                AppDaten.kuehlschrankToepfe.unshift({
                    ksId: Date.now(),
                    rezeptName: rezeptName,
                    datumGekocht: new Date().toISOString().slice(0, 10),
                    topfInfo: topfText,
                    waageBruttoStart: waageBrutto,
                    nettoStart: nettoStart,
                    geschoepftGesamt: 0,
                    wertePro100g: wertePro100g
                });

                speichereDaten();
                if (window.ksListeZeichnen) ksListeZeichnen();
                alert(`🧊 "${rezeptName}" (${nettoStart.toFixed(0)}g Netto) steht jetzt im Kühlschrank!`);
            };

            // Schöpft eine Portion in den Tagesplan & zieht sie vom Reststand ab
            window.ksPortionSchoepfen = function(ksId) {
                const eintrag = (AppDaten.kuehlschrankToepfe || []).find(k => k.ksId === ksId);
                if (!eintrag) return;

                const grammInput = document.getElementById('ks-gramm-' + ksId);
                const gramm = parseFloat(grammInput?.value);
                if (!gramm || gramm <= 0) return alert('Bitte die geschöpfte Grammzahl eingeben!');

                const mahlzeit = document.getElementById('ks-mz-' + ksId)?.value || 'Mittagessen';
                const zielDatum = document.getElementById('ks-datum-' + ksId)?.value || new Date().toISOString().slice(0, 10);

                if (!AppDaten.tagesplan[zielDatum]) AppDaten.tagesplan[zielDatum] = [];
                AppDaten.tagesplan[zielDatum].push({
                    eintragId: Date.now(),
                    mahlzeit: mahlzeit,
                    name: '🍲 ' + eintrag.rezeptName,
                    gramm: gramm,
                    wertePro100g: JSON.parse(JSON.stringify(eintrag.wertePro100g))
                });

                eintrag.geschoepftGesamt = (eintrag.geschoepftGesamt || 0) + gramm;
                speichereDaten();
                if (grammInput) grammInput.value = '';
                if (window.tpZeichnen) tpZeichnen();
                if (window.ksListeZeichnen) ksListeZeichnen();
                alert(`✅ ${gramm}g "${eintrag.rezeptName}" wurden eingetragen!`);
            };

            // Entfernt einen leeren Topf
            window.ksTopfEntfernen = function(ksId) {
                if (!confirm('Topf wirklich als leer markieren und entfernen?')) return;
                AppDaten.kuehlschrankToepfe = AppDaten.kuehlschrankToepfe.filter(k => k.ksId !== ksId);
                speichereDaten();
                if (window.ksListeZeichnen) ksListeZeichnen();
            };
        })();
    </script>

                                    </div>
                                    <div style="font-size: 12px; font-weight: bold; color: #2e6f56; margin-top: 2px;">📊 Pro 100g: ${makroText}</div>
                                </div>
                                <button type="button" onclick="ksTopfEntfernen(${k.ksId})" style="background: #dc3545; color: white; border: none; border-radius: 6px; padding: 5px 8px; font-size: 12px; font-weight: bold; cursor: pointer;">✅ Leer</button>
                            </div>
                            <div style="display: grid; grid-template-columns: 135px 135px 100px auto; gap: 6px; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #cbd5e1;">
                                <input type="date" id="ks-datum-${k.ksId}" value="${heuteStr}" style="margin: 0; padding: 6px; font-size: 13px;">
                                <select id="ks-mz-${k.ksId}" style="margin: 0; padding: 6px; font-size: 13px;">
                                    <option value="Frühstück">🍳 Frühstück</option>
                                    <option value="Mittagessen" selected>🍲 Mittagessen</option>
                                    <option value="Abendessen">🥗 Abendessen</option>
                                    <option value="Snack">🍎 Snack</option>
                                </select>
                                <input type="number" id="ks-gramm-${k.ksId}" placeholder="Gramm" style="margin: 0; padding: 6px; font-size: 13px;">
                                <button type="button" onclick="ksPortionSchoepfen(${k.ksId})" style="margin: 0; padding: 7px 10px; background: #2e6f56; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer;">🍽️ Schöpfen</button>
                            </div>
                        </div>`;
                }).join('');
            };

            ksListeZeichnen();
        })();

    <!-- BAUSTEIN 39B: BEILAGEN-KÜHLSCHRANK (Speichern, Schöpfen & Anzeige)   -->
    <!-- ===================================================================== -->
    <script>
        (function() {
            if (!document.getElementById('bks-liste')) return;

            function findeSpalte(woerter) {
                return (AppDaten.naehrstoffSpalten || []).find(s =>
                    woerter.some(w => s.toLowerCase().includes(w))
                );
            }

            // Überschreibt die Funktion aus Baustein 38: Speichert jetzt NUR noch im Beilagenrechner!
            window.auftImKuehlschrankLagern = function() {
                let rohSumme = 0;
                document.querySelectorAll('#auft-zeilen input[id^="auft-roh-"]').forEach(inp => {
                    rohSumme += parseFloat(inp.value) || 0;
                });
                if (rohSumme <= 0) return alert('Bitte links zuerst mindestens ein Rohgewicht (z.B. 100g) eintragen!');

                const topfSelect = document.getElementById('auft-topf-auswahl');
                const topfTara = parseFloat(topfSelect?.value) || 0;
                const topfText = topfSelect && topfTara > 0 ? topfSelect.options[topfSelect.selectedIndex].text : 'Ohne Topf';
                const waageBrutto = parseFloat(document.getElementById('auft-waage-gesamt')?.value) || 0;

                if (waageBrutto <= 0) return alert('Bitte rechts das gekochte Gewicht auf der Waage eintragen!');
                const nettoStart = waageBrutto - topfTara;
                if (nettoStart <= 0) return alert('Das Waagen-Gewicht ist kleiner als das Topfgewicht!');

                const lmId = parseFloat(document.getElementById('auft-lm-auswahl')?.value);
                const lm = (AppDaten.lebensmittel || []).find(item => item.id === lmId);
                if (!lm) return alert('Bitte ein Lebensmittel auswählen!');

                const wertePro100gGekocht = {};
                const faktor = rohSumme / nettoStart;
                for (const [spalte, rohWert] of Object.entries(lm.werte || {})) {
                    wertePro100gGekocht[spalte] = (rohWert || 0) * faktor;
                }

                const titel = `${lm.name} (gekocht, ${rohSumme.toFixed(0)}g roh)`;
                AppDaten.kuehlschrankBeilagen.unshift({
                    bksId: Date.now(),
                    name: titel,
                    topfInfo: topfText,
                    waageBruttoStart: waageBrutto,
                    nettoStart: nettoStart,
                    geschoepftGesamt: 0,
                    wertePro100g: wertePro100gGekocht
                });

                speichereDaten();
                bksListeZeichnen();

                const filter = document.getElementById('auft-lm-filter');
                if (filter && filter.value !== '') {
                    filter.value = '';
                    if (window.auftDropdownFuellen) auftDropdownFuellen();
                }

                alert(`🧊 "${titel}" (${nettoStart.toFixed(0)}g gekocht) liegt jetzt oben im Beilagen-Kühlschrank!`);
            };

            // Schöpft eine Portion Beilage in den Tagesplan & zieht sie vom Rest ab
            window.bksPortionSchoepfen = function(bksId) {
                const eintrag = (AppDaten.kuehlschrankBeilagen || []).find(b => b.bksId === bksId);
                if (!eintrag) return;

                const grammInput = document.getElementById('bks-gramm-' + bksId);
                const gramm = parseFloat(grammInput?.value);
                if (!gramm || gramm <= 0) return alert('Bitte die geschöpfte Grammzahl eingeben!');

                const mahlzeit = document.getElementById('bks-mz-' + bksId)?.value || 'Mittagessen';
                const zielDatum = document.getElementById('bks-datum-' + bksId)?.value || new Date().toISOString().slice(0, 10);

                if (!AppDaten.tagesplan[zielDatum]) AppDaten.tagesplan[zielDatum] = [];
                AppDaten.tagesplan[zielDatum].push({
                    eintragId: Date.now(),
                    mahlzeit: mahlzeit,
                    name: '🍚 ' + eintrag.name,
                    gramm: gramm,
                    wertePro100g: JSON.parse(JSON.stringify(eintrag.wertePro100g))
                });

                eintrag.geschoepftGesamt = (eintrag.geschoepftGesamt || 0) + gramm;
                speichereDaten();
                if (grammInput) grammInput.value = '';
                if (window.tpZeichnen) tpZeichnen();
                bksListeZeichnen();
                alert(`✅ ${gramm}g "${eintrag.name}" wurden für ${mahlzeit} (${zielDatum}) eingetragen!`);
            };

            // Entfernt eine leere Beilagen-Dose aus dem Kühlschrank
            window.bksEntfernen = function(bksId) {
                if (!confirm('Beilage wirklich als aufgegessen markieren und entfernen?')) return;
                AppDaten.kuehlschrankBeilagen = AppDaten.kuehlschrankBeilagen.filter(b => b.bksId !== bksId);
                speichereDaten();
                bksListeZeichnen();
            };

            // Zeichnet alle gekochten Beilagen direkt oben im Beilagenrechner
            window.bksListeZeichnen = function() {
                const liste = document.getElementById('bks-liste');
                const anzahlEl = document.getElementById('bks-anzahl');
                if (!liste || !anzahlEl) return;

                const daten = AppDaten.kuehlschrankBeilagen || [];
                anzahlEl.innerText = daten.length;

                if (daten.length === 0) {
                    liste.innerHTML = '<div style="font-size: 13px; color: #64748b;">Aktuell keine gekochte Beilage im Kühlschrank.</div>';
                    return;
                }

                const spKcal = findeSpalte(['kcal', 'kalorien', 'energie']);
                const spKh   = findeSpalte(['kohlenhydrat', 'kh']);
                const spProt = findeSpalte(['protein', 'eiweiß', 'eiweiss']);
                const spFett = findeSpalte(['fett']);
                const heuteStr = new Date().toISOString().slice(0, 10);

                liste.innerHTML = daten.map(b => {
                    const restNetto = Math.max(0, b.nettoStart - (b.geschoepftGesamt || 0));
                    const w = b.wertePro100g || {};
                    const makroText = [
                        spKcal ? `${(w[spKcal] || 0).toFixed(0)} kcal` : '',
                        spKh   ? `KH: ${(w[spKh] || 0).toFixed(1)}g` : '',
                        spProt ? `P: ${(w[spProt] || 0).toFixed(1)}g` : '',
                        spFett ? `F: ${(w[spFett] || 0).toFixed(1)}g` : ''
                    ].filter(Boolean).join(' | ');

                    const waageInfo = b.waageBruttoStart > 0 ? `Waage: <strong>${b.waageBruttoStart}g</strong> (${b.topfInfo})` : `Netto: ${b.nettoStart.toFixed(0)}g`;

                    return `
                        <div style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; margin-bottom: 8px; background: #f8fafc;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap;">
                                <div>
                                    <strong style="font-size: 15px;">🍚 ${b.name}</strong>
                                    <div style="font-size: 12px; color: #475569; margin-top: 2px;">
                                        ${waageInfo} • Start: <strong>${b.nettoStart.toFixed(0)}g</strong> • <span style="color: #2e6f56; font-weight: bold;">Rest ca. ${restNetto.toFixed(0)}g</span>
                                    </div>
                                    <div style="font-size: 12px; font-weight: bold; color: #2e6f56; margin-top: 2px;">📊 Pro 100g gekocht: ${makroText}</div>
                                </div>
                                <button type="button" onclick="bksEntfernen(${b.bksId})" style="background: #dc3545; color: white; border: none; border-radius: 6px; padding: 5px 8px; font-size: 12px; font-weight: bold; cursor: pointer;">✅ Leer</button>
                            </div>
                            <div style="display: grid; grid-template-columns: 135px 135px 100px auto; gap: 6px; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #cbd5e1;">
                                <input type="date" id="bks-datum-${b.bksId}" value="${heuteStr}" style="margin: 0; padding: 6px; font-size: 13px;">
                                <select id="bks-mz-${b.bksId}" style="margin: 0; padding: 6px; font-size: 13px;">
                                    <option value="Frühstück">🍳 Frühstück</option>
                                    <option value="Mittagessen" selected>🍲 Mittagessen</option>
                                    <option value="Abendessen">🥗 Abendessen</option>
                                    <option value="Snack">🍎 Snack</option>
                                </select>
                                <input type="number" id="bks-gramm-${b.bksId}" placeholder="Gramm" style="margin: 0; padding: 6px; font-size: 13px;">
                                <button type="button" onclick="bksPortionSchoepfen(${b.bksId})" style="margin: 0; padding: 7px 10px; background: #2e6f56; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer;">🍽️ Schöpfen</button>
                            </div>
                        </div>`;
                }).join('');
            };

            bksListeZeichnen();
